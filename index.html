<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1A051C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Reobote" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="icon" href="assets/icon-192.png" />
<title>Reobote Gestão</title>

<style>
:root{
  /* --- identidade Reobote --- */
  --plum-950:#1A051C; --plum-900:#26082A; --plum-850:#331036; --plum-800:#421847;
  --plum-700:#54235A; --line:#3E1642; --line-2:#552458;
  --orange:#E8924C; --orange-soft:#F5AE72; --orange-deep:#B96A28;
  --cream:#F8EFE7; --cream-2:#E3D2DC; --muted:#B394AC; --muted-2:#8A6A85;
  --ok:#5FCB93; --warn:#F0B24A; --bad:#F4607A; --info:#6FC6E8;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--plum-950);color:var(--cream);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 55% at 50% -8%,rgba(232,146,76,.13),transparent 62%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.serif{font-weight:800;letter-spacing:-.02em}
.mono{font-variant-numeric:tabular-nums}
.svgic{flex:none;vertical-align:middle}
.hide{display:none !important}

/* ================= header ================= */
header{position:sticky;top:0;z-index:30;padding:calc(var(--safe-top) + 15px) 18px 13px;
  background:linear-gradient(180deg,var(--plum-950) 58%,rgba(26,5,28,.82));backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;font-size:19px;font-weight:800;
  letter-spacing:-.02em;line-height:1;color:var(--cream)}
.wordmark .o-mark{display:inline-grid;place-items:center;width:19px;height:19px;margin:0 1px}
.wordmark small{font-family:var(--sans);font-size:8px;font-weight:800;letter-spacing:.22em;
  color:var(--muted-2);text-transform:uppercase;margin-left:7px}
.head-sp{flex:1}
.hbtn{width:37px;height:37px;border-radius:13px;background:var(--plum-900);border:1px solid var(--line);
  display:grid;place-items:center;position:relative;transition:.15s}
.hbtn:active{transform:scale(.93)}
.hbtn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--orange);box-shadow:0 0 0 2.5px var(--plum-900)}

main{padding:16px 14px 120px;position:relative;z-index:1}
.view{display:none;animation:fade .24s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.sec{font-size:10.5px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase;
  margin:26px 5px 12px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:2px}
.sec .sp{flex:1}
.sec button{font-size:11.5px;letter-spacing:.02em;color:var(--orange-soft);text-transform:none;font-weight:700}

/* ================= hero ================= */
.hero{border-radius:26px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--plum-800),var(--plum-900) 72%);border:1px solid var(--line-2)}
.hero::after{content:"";position:absolute;right:-38px;top:-38px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,146,76,.22),transparent 68%)}
.hero .hi{font-size:12.5px;color:var(--muted);font-weight:600}
.hero .hn{font-size:23px;font-weight:800;margin-top:4px;letter-spacing:-.03em}
.hero .hd{display:flex;gap:22px;margin-top:17px;position:relative;z-index:1}
.hero .hd>div{min-width:0}
.hero .hl{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);font-weight:800}
.hero .hv{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.hero .hv small{font-size:11px;color:var(--muted);font-weight:700;margin-left:2px}

/* ================= cards ================= */
.card{background:var(--plum-900);border:1px solid var(--line);border-radius:20px;padding:16px}
.card+.card{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}

.kpi{background:var(--plum-900);border:1px solid var(--line);border-radius:19px;padding:14px}
.kpi .kl{font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.1em;font-weight:800;
  display:flex;align-items:center;gap:5px}
.kpi .kv{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.04em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .ks{font-size:11px;color:var(--muted-2);margin-top:6px;font-weight:600;line-height:1.35}
.kpi.good .kv{color:var(--ok)} .kpi.bad .kv{color:var(--bad)} .kpi.warn .kv{color:var(--warn)}
.kpi.brand .kv{color:var(--orange-soft)}

/* atalhos estilo Scoopa */
.qk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:19px;
  background:var(--plum-900);border:1px solid var(--line);transition:.15s}
.qk:active{transform:scale(.96);background:var(--plum-850)}
.qk .qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--plum-800),var(--plum-850));border:1px solid var(--line-2)}
.qk span{font-size:10.5px;font-weight:700;color:var(--cream-2);text-align:center;line-height:1.25}

.alert{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;
  background:var(--plum-900);border:1px solid var(--line);border-left:3px solid var(--muted-2);margin-bottom:9px}
.alert.warn{border-left-color:var(--warn);background:linear-gradient(92deg,rgba(240,178,74,.1),var(--plum-900) 58%)}
.alert.bad{border-left-color:var(--bad);background:linear-gradient(92deg,rgba(244,96,122,.11),var(--plum-900) 58%)}
.alert.ok{border-left-color:var(--ok)}
.alert .at{font-size:13.5px;font-weight:700;line-height:1.3}
.alert .ad{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.alert .aa{margin-left:auto;align-self:center;font-size:11px;font-weight:800;color:var(--orange-soft);white-space:nowrap}

/* ================= fotos ================= */
.thumb{width:100%;height:100%;object-fit:cover;display:block}
.item .ic.foto{overflow:hidden;padding:0}
.fotobox{width:100%;height:150px;border-radius:18px;background:var(--plum-850);border:1px dashed var(--line-2);
  display:grid;place-items:center;overflow:hidden;position:relative;margin-bottom:10px}
.fotobox img{width:100%;height:100%;object-fit:cover}
.fotobox .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted-2);
  font-size:12px;font-weight:700}
.fotobox .rm{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:10px;
  background:rgba(10,2,11,.72);display:grid;place-items:center;backdrop-filter:blur(6px)}
.fotohead{width:100%;height:180px;border-radius:20px;overflow:hidden;margin-bottom:14px;background:var(--plum-850)}
.fotohead img{width:100%;height:100%;object-fit:cover}

/* ================= itens ================= */
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--plum-900);
  border:1px solid var(--line);border-radius:18px;margin-bottom:8px;transition:.15s;text-align:left;width:100%}
.item:active{transform:scale(.99);background:var(--plum-850)}
.item .ic{width:40px;height:40px;border-radius:13px;background:var(--plum-850);display:grid;place-items:center;flex:none}
.item .bd{flex:1;min-width:0}
.item .t{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:11.5px;color:var(--muted-2);margin-top:2.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{text-align:right;flex:none}
.item .rv{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.item .rs{font-size:10.5px;color:var(--muted-2);margin-top:2px;font-weight:700}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:3.5px 7px;border-radius:7px;background:var(--plum-800);color:var(--muted)}
.tag.ok{background:rgba(95,203,147,.15);color:var(--ok)}
.tag.warn{background:rgba(240,178,74,.15);color:var(--warn)}
.tag.bad{background:rgba(244,96,122,.15);color:var(--bad)}
.tag.info{background:rgba(111,198,232,.15);color:var(--info)}
.tag.brand{background:rgba(232,146,76,.16);color:var(--orange-soft)}

.bar{height:5px;border-radius:3px;background:var(--plum-800);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .45s}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

.empty{text-align:center;padding:46px 22px;color:var(--muted-2)}
.empty .et{font-size:13.5px;font-weight:700;color:var(--muted);margin-top:13px}
.empty .es{font-size:11.5px;margin-top:6px;line-height:1.55}

/* ================= botões ================= */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;border-radius:16px;
  font-size:14px;font-weight:800;letter-spacing:-.01em;width:100%;transition:.15s;
  background:linear-gradient(140deg,var(--orange),var(--orange-deep));color:#2A0F04;
  box-shadow:0 10px 24px -12px var(--orange)}
.btn:active{transform:scale(.985);filter:brightness(.95)}
.btn.ghost{background:var(--plum-900);border:1px solid var(--line-2);color:var(--cream);box-shadow:none}
.btn.ok{background:linear-gradient(140deg,var(--ok),#37936A);color:#05240F;box-shadow:0 10px 24px -12px var(--ok)}
.btn.danger{background:var(--plum-900);border:1px solid rgba(244,96,122,.4);color:var(--bad);box-shadow:none}
.btn.sm{padding:11px 15px;font-size:12.5px;border-radius:13px;width:auto}
.btn:disabled{opacity:.38;pointer-events:none}
.btnrow{display:flex;gap:9px;margin-top:13px}

/* ================= form ================= */
.f{margin-bottom:14px}
.f label{display:block;font-size:10.5px;font-weight:800;color:var(--muted-2);text-transform:uppercase;
  letter-spacing:.11em;margin-bottom:8px}
.f input,.f select,.f textarea{width:100%;padding:14px;border-radius:15px;background:var(--plum-850);
  border:1px solid var(--line);color:var(--cream);outline:none;transition:.15s;-webkit-appearance:none}
.f input::placeholder,.f textarea::placeholder{color:var(--muted-2)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--orange);background:var(--plum-800)}
.f textarea{resize:vertical;min-height:76px;line-height:1.5}
.f .hint{font-size:11px;color:var(--muted-2);margin-top:7px;line-height:1.45}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.rolagem{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.rolagem::-webkit-scrollbar{display:none}
.chips.rolagem .chip{flex:none}
.chip{padding:10px 14px;border-radius:13px;background:var(--plum-900);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;transition:.15s;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:linear-gradient(140deg,var(--orange),var(--orange-deep));border-color:var(--orange);color:#2A0F04}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--plum-800);border:1px solid var(--line-2);
  font-size:19px;font-weight:700;display:grid;place-items:center}
.stepper input{text-align:center;flex:1}

/* ================= gráfico ================= */
.graf{display:flex;align-items:stretch;gap:9px;height:150px;padding:14px 4px 0}
.gcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.gtrack{flex:1;width:100%;max-width:34px;display:flex;align-items:flex-end}
.gbar{width:100%;background:var(--plum-800);border-radius:7px 7px 3px 3px;
  display:flex;align-items:flex-end;overflow:hidden;transition:height .5s}
.gbar i{display:block;width:100%;background:linear-gradient(180deg,var(--orange),var(--orange-deep));
  border-radius:5px 5px 0 0;transition:height .5s}
.gbar i.neg{background:linear-gradient(180deg,var(--bad),#8E1F35)}
.gcol span{font-size:9.5px;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em}

/* ================= barras horizontais ================= */
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hrow:last-child{margin-bottom:0}
.hrow .hl2{font-size:12px;font-weight:700;width:92px;flex:none;color:var(--cream-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .htrack{flex:1;height:10px;border-radius:5px;background:var(--plum-850);overflow:hidden;min-width:20px}
.hrow .htrack i{display:block;height:100%;border-radius:5px;transition:width .5s}
.hrow .hv2{font-size:11.5px;font-weight:800;width:88px;text-align:right;flex:none;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:var(--cream-2)}

.var{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;
  padding:2.5px 6px;border-radius:6px;margin-left:6px;letter-spacing:.02em}
.var.up{background:rgba(95,203,147,.15);color:var(--ok)}
.var.down{background:rgba(244,96,122,.15);color:var(--bad)}
.var.flat{background:var(--plum-800);color:var(--muted-2)}

/* ================= demonstrativo ================= */
.dl{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--plum-900);
  border:1px solid var(--line);border-radius:15px;margin-bottom:7px}
.dl .dn{flex:1;font-size:13.5px;font-weight:700}
.dl .dn small{display:block;font-size:11px;color:var(--muted-2);font-weight:600;margin-top:2px}
.dl .dv{font-size:15px;font-weight:800;letter-spacing:-.02em}
.dl.tot{background:linear-gradient(140deg,var(--plum-800),var(--plum-850));border-color:var(--line-2);padding:16px 15px}
.dl.tot .dn{font-size:15px}
.dl.tot .dv{font-size:19px}

/* ================= nav ================= */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:40;
  background:rgba(26,5,28,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:9px 8px calc(var(--safe-bottom) + 9px);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;
  color:var(--muted-2);transition:.16s;position:relative}
.nb.on{color:var(--orange)}
.nb.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2.5px;
  border-radius:2px;background:var(--orange)}
.nb span{font-size:9.5px;font-weight:800;letter-spacing:.01em}
.nb .nd{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--orange);color:#2A0F04;font-size:9px;font-weight:800;display:grid;place-items:center}

/* ================= sheet ================= */
.ov{position:fixed;inset:0;background:rgba(10,2,11,.76);backdrop-filter:blur(4px);z-index:50;opacity:0;
  pointer-events:none;transition:.24s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,102%);width:100%;max-width:560px;z-index:60;
  background:var(--plum-900);border-radius:28px 28px 0 0;border:1px solid var(--line-2);border-bottom:none;
  max-height:93vh;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet-h{padding:18px 18px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  flex:none;position:relative}
.sheet-h .gr{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;
  border-radius:2px;background:var(--plum-800)}
.sheet-h h3{font-size:17.5px;font-weight:800;flex:1;letter-spacing:-.025em}
.sheet-h .sub{font-size:11.5px;color:var(--muted-2);margin-top:2px;font-weight:600}
.sheet-b{padding:17px 18px calc(var(--safe-bottom) + 22px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:33px;height:33px;border-radius:11px;background:var(--plum-850);display:grid;place-items:center;flex:none}

.toast{position:fixed;bottom:calc(var(--safe-bottom) + 94px);left:50%;transform:translate(-50%,22px);
  background:var(--plum-800);border:1px solid var(--line-2);color:var(--cream);padding:13px 19px;border-radius:15px;
  font-size:13px;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:.26s;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.8);max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:var(--ok)} .toast.bad{border-color:var(--bad)}

/* ================= lock ================= */
#lock{position:fixed;inset:0;z-index:100;background:var(--plum-950);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:34px;text-align:center}
#lock::before{content:"";position:absolute;inset:0;
  background:radial-gradient(80% 42% at 50% 22%,rgba(232,146,76,.16),transparent 66%)}
#lock>*{position:relative;z-index:1}
#lock .lw{font-size:30px;font-weight:800;display:flex;align-items:center;margin-bottom:6px;letter-spacing:-.03em}
#lock .lw .o-mark{width:28px;height:28px}
#lock .lt{font-size:9px;font-weight:800;letter-spacing:.34em;color:var(--orange);text-transform:uppercase;margin-bottom:32px}
#lockSair{margin-top:28px;font-size:12.5px;font-weight:700;color:var(--muted-2);padding:10px 16px}
#lock p{font-size:12.5px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.pins{display:flex;gap:12px;margin-bottom:24px}
.pin{width:14px;height:14px;border-radius:50%;background:var(--plum-850);border:1px solid var(--line-2);transition:.16s}
.pin.on{background:var(--orange);border-color:var(--orange);transform:scale(1.18)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:252px}
.key{height:62px;border-radius:19px;background:var(--plum-900);border:1px solid var(--line);
  font-size:22px;font-weight:700;display:grid;place-items:center;transition:.12s;color:var(--cream)}
.key:active{background:var(--plum-800);transform:scale(.95)}
.key.fn{background:transparent;border-color:transparent;font-size:12.5px;color:var(--muted-2);font-weight:800}
.shake{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
</style>

<!-- ======================= LOCK ======================= -->
<div id="lock">
  <div class="lw" id="lockWord"></div>
  <div class="lt">Financeiro</div>
  <p id="lockSub">Área restrita — digite a senha</p>
  <div class="pins" id="pins"></div>
  <div class="keys" id="keys"></div>
  <button id="lockSair">Voltar ao app</button>
</div>

<!-- ======================= HEADER ======================= -->
<header>
  <div class="wordmark" id="hdWord"></div>
  <div class="head-sp"></div>
  <button class="hbtn" id="btnAlerts"><span class="dot hide" id="alertDot"></span></button>
  <button class="hbtn" id="btnUser"></button>
  <button class="hbtn" id="btnMais"></button>
</header>

<main>
  <!-- ---------------- HOME ---------------- -->
  <div class="view active" id="v-home">
    <div id="heroBox"></div>
    <div id="homePassos" style="margin-top:6px"></div>
    <div id="homeAlerts" style="margin-top:14px"></div>
    <div class="sec">Atalhos</div>

/* Comprime a foto antes de guardar: o aparelho tem espaço limitado e
   uma foto de câmera crua ocupa o espaço de umas 100 fotos tratadas. */
function comprimeFoto(file,max,q){
  return new Promise((ok,err)=>{
    const fr=new FileReader();
    fr.onerror=()=>err(new Error('não consegui ler a imagem'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>err(new Error('arquivo não é uma imagem'));
      im.onload=()=>{
        max=max||620;
        let {width:w,height:h}=im;
        const esc=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*esc); h=Math.round(h*esc);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        ok(cv.toDataURL('image/jpeg',q||0.72));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* campo de foto reutilizável: desenha em #box e devolve o valor em cb */
function campoFoto(boxId,atual,cb){
  let foto=atual||'';
  const draw=()=>{
    const b=$('#'+boxId); if(!b) return;
    b.innerHTML=foto
      ? '<img src="'+foto+'" alt=""><button class="rm" data-fotorm="1">'+ic('close',15,'var(--cream)')+'</button>'
      : '<div class="ph">'+ic('scan',26,'var(--muted-2)',1.5)+'Toque para adicionar uma foto</div>';
    b.onclick=e=>{
      if(e.target.closest('[data-fotorm]')){ foto=''; cb(foto); draw(); return; }
      const inp=document.createElement('input');
      inp.type='file'; inp.accept='image/*';
      inp.onchange=async()=>{
        const f=inp.files[0]; if(!f) return;
        try{ foto=await comprimeFoto(f); cb(foto); draw(); toast('Foto adicionada','ok'); }
        catch(err){ toast('Não consegui usar essa imagem','bad'); }
      };
      inp.click();
    };
  };
  draw();
}

/* ---------------------------- ESTADO ---------------------------- */
const KEY='reobote_v1';
let DB=null, VIEW='home';

/* O app abre livre para a equipe. Quem opera é apenas identificado (sem senha),
   para que produção, perda e temperatura fiquem com nome no registro.
   A única área trancada é o Financeiro. */
const SENHA_FIN='2409';
let finLiberado=false;

const quem=()=>gUn(DB.cfg.unidade).nome;   /* o registro é assinado pela unidade, não por pessoa */
const can=()=>true;

function seed(){
  return {
    unidades:[
      {id:'u1',nome:'Fábrica',            tipo:'fabrica'},
      {id:'u2',nome:'Loja Centro',        tipo:'loja'},
      {id:'u3',nome:'Loja Zona Sul',      tipo:'loja'},
      {id:'u4',nome:'Loja São Benedito',  tipo:'loja'},
      {id:'u5',nome:'Distribuição',       tipo:'dist'},
    ],
    insumos:[], fichas:[], clientes:[], freezers:[],
    producoes:[], estoque:[], transf:[], perdas:[], temps:[], pedidos:[],
    despesas:[], caixa:[],
    cfg:{unidade:'u1', metaLitrosDia:0, alertaValidade:15, versao:'2.1'},
  };
}

/* Os dados de demonstração da versão anterior saem do ar sozinhos. */
function ehDemo(d){
  return (d.insumos||[]).some(i=>i.id==='i1') || (d.fichas||[]).some(f=>f.id==='f1');
}

function load(){
  try{ const raw=localStorage.getItem(KEY); DB=raw?JSON.parse(raw):seed(); }
  catch(e){ DB=seed(); }
  const base=seed();
  if(!DB.cfg) DB.cfg=base.cfg;
  /* limpa os dados de exemplo da v1 */
  if(ehDemo(DB)){ DB=base; }
  /* migração da v1.0 (que tinha login por PIN) */
  delete DB.users; delete DB.equipe; delete DB.cfg.operador;
  if(!DB.despesas) DB.despesas=[];
  if(!DB.caixa) DB.caixa=[];
  DB.cfg.versao=base.cfg.versao;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('Sem espaço para salvar','bad'); } }

/* lookups */
const gUn = id=>DB.unidades.find(x=>x.id===id)||{nome:'—'};
const gIns= id=>DB.insumos.find(x=>x.id===id);
const gFic= id=>DB.fichas.find(x=>x.id===id);
const gCli= id=>DB.clientes.find(x=>x.id===id)||{nome:'—'};
const gFz = id=>DB.freezers.find(x=>x.id===id)||{cod:'—'};

/* custo de uma ficha (recursivo: montagem usa semiacabado) */
function custoFicha(f,prof){
  if(!f) return 0; prof=prof||0; if(prof>4) return 0;
  let t=0;
  for(const [rid,q] of f.itens){
    if(rid[0]==='i'){ const i=gIns(rid); if(i) t+=i.custo*q; }
    else { const sub=gFic(rid); if(sub) t+=(custoFicha(sub,prof+1)/(sub.rend||1))*q; }
  }
  return t;
}
const custoUnit=f=>f?custoFicha(f)/(f.rend||1):0;
function margem(f){
  if(!f||!f.preco) return null;
  const c=custoUnit(f);
  if(c<=0) return null;   /* sem receita cadastrada não dá para saber a margem */
  return {custo:c,preco:f.preco,lucro:f.preco-c,pct:((f.preco-c)/f.preco)*100};
}
/* estoque de produto acabado */
function estoqueDe(fid,unid){
  return DB.estoque.filter(e=>e.fid===fid&&(!unid||e.uid===unid)).reduce((s,e)=>s+e.qtd,0);
}
function lotesDe(fid,unid){
  return DB.estoque.filter(e=>e.fid===fid&&e.qtd>0&&(!unid||e.uid===unid)).sort((a,b)=>(a.val||'').localeCompare(b.val||''));
}
function addEstoque(uid_,fid,lote,qtd,val){
  const e=DB.estoque.find(x=>x.uid===uid_&&x.fid===fid&&x.lote===lote);
  if(e) e.qtd+=qtd; else DB.estoque.push({id:uid(),uid:uid_,fid,lote,qtd,val});
}
function baixaEstoque(uid_,fid,qtd){ /* FEFO */
  let falta=qtd;
  for(const e of lotesDe(fid,uid_)){ if(falta<=0)break; const t=Math.min(e.qtd,falta); e.qtd-=t; falta-=t; }
  DB.estoque=DB.estoque.filter(e=>e.qtd>0.0001);
  return falta<=0.0001;
}
</script>

  DB.insumos.forEach(i=>{
    if(i.estoque<=0) A.push({n:'bad',t:i.nome+' zerado',d:'Sem saldo em estoque. Produção pode parar.',a:'comprar',go:()=>{go('insumos');abrirInsumo(i.id);}});
    else if(i.estoque<i.min) A.push({n:'warn',t:i.nome+' abaixo do mínimo',d:num(i.estoque,1)+' '+i.un+' · mínimo '+num(i.min,1)+' '+i.un,a:'repor',go:()=>{go('insumos');abrirInsumo(i.id);}});
  });
  const lim=DB.cfg.alertaValidade||15;
  DB.estoque.forEach(e=>{
    if(!e.val)return; const d=dias(hoje(),e.val);
    if(d<0) A.push({n:'bad',t:'Lote vencido — '+(gFic(e.fid)||{}).nome,d:'Lote '+e.lote+' venceu em '+fmtD(e.val)+' · '+num(e.qtd,1)+' un',a:'baixar',go:()=>{go('perdas');novaPerda(e.fid);}});
    else if(d<=lim) A.push({n:'warn',t:'Vence em '+d+'d — '+(gFic(e.fid)||{}).nome,d:'Lote '+e.lote+' · '+num(e.qtd,1)+' em '+gUn(e.uid).nome,a:'girar',go:()=>go('est')});
  });
  DB.freezers.forEach(f=>{
    const hj=DB.temps.filter(t=>t.fzid===f.id&&t.data.slice(0,10)===hoje());
    const ult=DB.temps.filter(t=>t.fzid===f.id).sort((a,b)=>b.data.localeCompare(a.data))[0];
    if(ult&&ult.temp>f.alvo+3) A.push({n:'bad',t:f.cod+' fora da faixa',d:num(ult.temp,1)+'°C · alvo '+f.alvo+'°C · '+f.local,a:'ver',go:()=>{go('frio');abrirFreezer(f.id);}});
    else if(!hj.length) A.push({n:'warn',t:f.cod+' sem leitura hoje',d:f.local,a:'medir',go:()=>{go('frio');medirTemp(f.id);}});
  });
  const novos=DB.pedidos.filter(p=>p.status==='novo').length;
  if(novos) A.push({n:'ok',t:novos+' pedido'+(novos>1?'s':'')+' aguardando',d:'Recebidos pelo portal do cliente',a:'abrir',go:()=>go('ped')});
  const rec=DB.transf.filter(t=>t.status==='enviado'&&t.para===DB.cfg.unidade).length;
  if(rec) A.push({n:'warn',t:rec+' transferência'+(rec>1?'s':'')+' para conferir',d:'Chegou em '+gUn(DB.cfg.unidade).nome+' e falta aceite',a:'conferir',go:()=>go('transf')});
  return A;
}

const NAV=[['home','Início','home'],['prod','Produção','prod'],['est','Estoque','box'],['ped','Pedidos','cart'],['fin','Financeiro','money']];
function renderNav(){
  const novos=DB.pedidos.filter(p=>p.status==='novo').length;
  $('#nav').innerHTML=NAV.map(([id,lb,i])=>{
    const off=!can(id);
    return '<button class="nb'+(VIEW===id?' on':'')+'" data-go="'+id+'" '+(off?'style="opacity:.28;pointer-events:none"':'')+'>'+
      ic(i,21)+'<span>'+lb+'</span>'+(id==='ped'&&novos?'<i class="nd">'+novos+'</i>':'')+'</button>';
  }).join('');
}
function go(v){
  if(v==='fin' && !finLiberado){ abreCadeado(); return; }
  VIEW=v; $$('.view').forEach(x=>x.classList.remove('active'));
  const el=$('#v-'+v); if(el) el.classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
  renderNav(); RENDER[v]&&RENDER[v]();
}

    kpi('Perdas no mês',money(tot),mes.length+' registros',tot>0?'bad':'good','trash'),
    kpi('Maior causa',top?top[0]:'—',top?money(top[1]):'nenhuma perda','warn','alert'),
  ].join('');
  const L=[...DB.perdas].sort((a,b)=>b.ts-a.ts).slice(0,30);
  $('#perdaList').innerHTML=L.length?L.map(p=>
    '<div class="item"><div class="ic">'+ic('trash',18,'var(--bad)')+'</div>'+
    '<div class="bd"><div class="t">'+esc((gFic(p.fid)||{}).nome||'—')+'</div>'+
    '<div class="s">'+esc(p.motivo)+' · '+gUn(p.uid).nome+' · '+esc(p.quem)+'</div></div>'+
    '<div class="rt"><div class="rv mono" style="color:var(--bad)">-'+money(p.valor)+'</div>'+
    '<div class="rs">'+num(p.qtd,1)+' un · '+fmtD(p.data)+'</div></div></div>').join('')
    :vazio('trash','Nenhuma perda registrada','Perda que não é registrada vira prejuízo invisível.');
};

/* ---------- CADEIA DE FRIO ---------- */
RENDER.frio=()=>{
  const semLeitura=DB.freezers.filter(f=>!DB.temps.some(t=>t.fzid===f.id&&t.data.slice(0,10)===hoje())).length;
  const fora=DB.freezers.filter(f=>{const u=DB.temps.filter(t=>t.fzid===f.id).sort((a,b)=>b.data.localeCompare(a.data))[0];
    return u&&u.temp>f.alvo+3;}).length;
  $('#frioKpis').innerHTML=[
    kpi('Sem leitura hoje',semLeitura,semLeitura?'medir agora':'todos medidos',semLeitura?'warn':'good','thermo'),
    kpi('Fora da faixa',fora,fora?'risco de perda':'tudo na temperatura',fora?'bad':'good','alert'),
    kpi('Cedidos a clientes',naRua,'espalhados pela região','brand','store'),
    kpi('Total de freezers',DB.freezers.length,'sob controle','','thermo'),
  ].join('');
  const naRua=DB.freezers.filter(f=>f.tipo==='comodato').length;
  const linhaFz=f=>{
    const u=DB.temps.filter(t=>t.fzid===f.id).sort((a,b)=>b.data.localeCompare(a.data))[0];
    const cls=!u?'':u.temp>f.alvo+3?'bad':u.temp>f.alvo+1?'warn':'ok';
    return '<button class="item" data-fz="'+f.id+'"><div class="ic">'+ic('thermo',18,'var(--'+(cls==='ok'?'ok':cls||'muted')+')')+'</div>'+
      '<div class="bd"><div class="t">'+esc(f.cod)+'</div>'+
      '<div class="s">'+esc(f.local||'sem local')+(f.cidade?' · '+esc(f.cidade):'')+' · alvo '+f.alvo+'°C</div></div>'+
      '<div class="rt"><div class="rv mono" style="'+(cls&&cls!=='ok'?'color:var(--'+cls+')':'')+'">'+(u?num(u.temp,1)+'°':'—')+'</div>'+
      '<div class="rs">'+(u?fmtDH(u.data).slice(6):'sem leitura')+'</div></div></button>';
  };
  const nossos=DB.freezers.filter(f=>f.tipo!=='comodato');
  const cedidos=DB.freezers.filter(f=>f.tipo==='comodato');
  $('#frioList').innerHTML=DB.freezers.length
    ? (nossos.length?'<div class="sec" style="margin-top:2px">Nas nossas unidades</div>'+nossos.map(linhaFz).join(''):'')+
      (cedidos.length?'<div class="sec">Cedidos a clientes ('+cedidos.length+')</div>'+cedidos.map(linhaFz).join(''):'')
    : vazio('thermo','Nenhum freezer','Cadastre os das lojas e também os cedidos a padarias, mercados e restaurantes.');
};

/* ---------- CLIENTES ---------- */
RENDER.clientes=()=>{
  $('#cliList').innerHTML=DB.clientes.map(c=>{
    const peds=DB.pedidos.filter(p=>p.cid===c.id);
    const tot=peds.reduce((s,p)=>s+p.total,0);
    const ult=peds.sort((a,b)=>b.ts-a.ts)[0];
    const parado=ult?dias(ult.data.slice(0,10),hoje()):null;
    return '<button class="item" data-cli="'+c.id+'"><div class="ic">'+ic('store',18,'var(--orange)')+'</div>'+
      '<div class="bd"><div class="t">'+esc(c.nome)+(c.freezer?' <span class="tag info">freezer</span>':'')+'</div>'+
      '<div class="s">'+esc([c.end,c.cidade].filter(Boolean).join(' · ')||c.contato||'—')+'</div></div>'+
      '<div class="rt"><div class="rv mono">'+money(tot)+'</div>'+
      '<div class="rs">'+(parado===null?'sem pedido':parado>30?'<span class="tag bad">'+parado+'d parado</span>':'há '+parado+'d')+'</div></div></button>';
  }).join('')||vazio('store','Nenhum cliente','Cadastre as revendas para liberar o portal de pedidos.');
};

/* ---------- CUSTOS ---------- */
RENDER.custos=()=>{
  const comPreco=DB.fichas.filter(f=>f.preco>0&&margem(f));
  const mm=comPreco.length?comPreco.reduce((s,f)=>s+margem(f).pct,0)/comPreco.length:0;
  const pior=comPreco.map(f=>({f,m:margem(f)})).sort((a,b)=>a.m.pct-b.m.pct)[0];
  $('#custoKpis').innerHTML=[
    kpi('Margem média',num(mm,0)+'%',comPreco.length+' itens com preço',mm<50?'warn':'good','chart'),
    kpi('Menor margem',pior?num(pior.m.pct,0)+'%':'—',pior?pior.f.nome:'—','bad','alert'),
  ].join('');
  $('#custoList').innerHTML=comPreco.sort((a,b)=>margem(a).pct-margem(b).pct).map(f=>{
    const m=margem(f);
    return '<button class="item" data-fic="'+f.id+'"><div class="ic">'+ic('money',18,'var(--'+(m.pct<45?'bad':m.pct<60?'warn':'ok')+')')+'</div>'+
      '<div class="bd"><div class="t">'+esc(f.nome)+'</div>'+
      '<div class="s">custo '+money(custoUnit(f))+' · venda '+money(f.preco)+'</div>'+
      '<div class="bar"><i class="'+(m.pct<45?'bad':m.pct<60?'warn':'')+'" style="width:'+Math.max(0,Math.min(100,m.pct))+'%"></i></div></div>'+
      '<div class="rt"><div class="rv mono">'+num(m.pct,0)+'%</div><div class="rs">'+money(m.lucro)+'</div></div></button>';
  }).join('')||vazio('money','Nada para comparar ainda','A margem aparece quando o produto tem preço de venda E receita cadastrada — sem receita, o app não sabe quanto custa produzir.');
};

/* ---------- CONFIG ---------- */
RENDER.config=()=>{
  $('#cfgBody').innerHTML=
    '<div class="card"><div class="f"><label>Unidade atual</label><select id="cfgUn">'+
      DB.unidades.map(u=>'<option value="'+u.id+'"'+(DB.cfg.unidade===u.id?' selected':'')+'>'+esc(u.nome)+'</option>').join('')+
    '</select><div class="hint">Define de onde saem baixas e transferências neste aparelho.</div></div>'+
    '<div class="f2"><div class="f"><label>Meta litros/dia</label><input id="cfgMeta" type="number" value="'+DB.cfg.metaLitrosDia+'"></div>'+
    '<div class="f"><label>Alerta validade (dias)</label><input id="cfgVal" type="number" value="'+DB.cfg.alertaValidade+'"></div></div>'+
    '<button class="btn sm" id="cfgSalvar" style="width:100%">Salvar</button></div>'+
    '<div class="sec">Unidades</div>'+
    DB.unidades.map(u=>'<div class="item"><div class="ic">'+ic(u.tipo==='fabrica'?'factory':u.tipo==='loja'?'store':'truck',18,'var(--muted)')+
      '</div><div class="bd"><div class="t">'+esc(u.nome)+'</div><div class="s">'+u.tipo+'</div></div></div>').join('')+
    '<button class="btn ghost sm" id="btnNovaUnid" style="width:100%;margin-top:6px">'+ic('plus',15)+' Nova unidade</button>'+
    '<div class="sec">Pedidos em tempo real</div>'+
    (function(){
      const perm=('Notification' in window)?Notification.permission:'indisponivel';
      const ok=nuvem.ligado&&!nuvem.erro;
      return '<div class="alert '+(ok?'ok':nuvem.erro?'bad':'warn')+'" style="margin-bottom:10px">'+
        ic(ok?'check':'alert',18,'var(--'+(ok?'ok':nuvem.erro?'bad':'warn')+')')+
        '<div style="flex:1"><div class="at">'+(ok?'Conectado à nuvem'
          :nuvem.erro?'Nuvem indisponível':'Conectando...')+'</div>'+
        '<div class="ad">'+(ok?'Pedido feito no portal aparece aqui na hora.'
          :nuvem.erro==='tabela ainda não criada no Supabase'
            ?'Falta rodar o arquivo supabase-pedidos.sql no painel do Supabase — depois disso funciona sozinho.'
          :nuvem.erro==='projeto Supabase da Reobote ainda não criado'
            ?'Crie um projeto no Supabase só para a Reobote e me passe a URL e a chave. Enquanto isso, o pedido do portal chega pelo WhatsApp.'
            :esc(nuvem.erro||'aguarde alguns segundos'))+'</div></div></div>'+
      (perm==='granted'
        ?'<div class="alert ok" style="margin-bottom:10px">'+ic('bell',18,'var(--ok)')+
         '<div style="flex:1"><div class="at">Notificação ligada</div>'+
         '<div class="ad">Este aparelho avisa com som quando entra pedido.</div></div></div>'
        :'<button class="btn ghost" id="btnNotif">'+ic('bell',17)+
         (perm==='denied'?' Notificação bloqueada no navegador':' Ligar notificação neste aparelho')+'</button>');
    })()+
    '<div class="sec">Portal de pedidos</div>'+
    '<div class="card" style="margin-bottom:10px;font-size:12.5px;color:var(--muted);line-height:1.55">'+
      'O portal do cliente mostra os produtos que tiverem <b style="color:var(--cream-2)">preço de venda</b> cadastrado. '+
      'Depois de mexer nos produtos, gere o catálogo e suba o arquivo junto com o site.</div>'+
    '<button class="btn ghost" id="btnCatalogo">'+ic('down',17)+' Gerar catálogo do portal</button>'+
    '<div class="sec">Dados</div>'+
    '<button class="btn ghost" id="btnExport">'+ic('down',17)+' Exportar backup (JSON)</button>'+
    '<div class="btnrow"><button class="btn ghost" id="btnImport">Importar backup</button>'+
    '<button class="btn danger" id="btnReset">Zerar tudo</button></div>'+
    '<div class="hint" style="margin-top:12px;color:var(--muted-2);font-size:11px;line-height:1.5">'+
    'Produção, estoque e financeiro ficam neste aparelho — faça o backup de vez em quando. '+
    'Os pedidos do portal são os únicos que passam pela nuvem, para chegarem na hora em todos os celulares.</div>';
};
</script>

<script>
/* =====================================================================
   SHEET
   ===================================================================== */
function sheet(t,s,html){
  $('#shTitle').textContent=t;
  $('#shSub').textContent=s||''; $('#shSub').classList.toggle('hide',!s);
  $('#shBody').innerHTML=html;
  $('#ov').classList.add('on'); $('#sheet').classList.add('on');
}
function fecha(){ $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); }
const val=id=>{const e=$('#'+id);return e?e.value.trim():'';};
const nval=id=>{const e=$('#'+id);return e?(parseFloat(e.value.replace(',','.'))||0):0;};

/* =====================================================================
   PRODUÇÃO
   ===================================================================== */
function novoLote(){
  const d=new Date(), b=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const n=DB.producoes.filter(p=>p.lote.startsWith(b)).length+1;
  return b+'-'+String(n).padStart(2,'0');
}
function disponibilidade(f,mult){
  const falta=[];
  f.itens.forEach(([rid,q])=>{
    const need=q*mult;
    if(rid[0]==='i'){ const i=gIns(rid); if(i&&i.estoque<need) falta.push({nome:i.nome,need,tem:i.estoque,un:i.un}); }
    else { const sub=gFic(rid); const tem=estoqueDe(rid,DB.cfg.unidade);
      if(sub&&tem<need) falta.push({nome:sub.nome+' (semi)',need,tem,un:sub.un}); }
  });
  return falta;
}
function consumir(f,mult){
  f.itens.forEach(([rid,q])=>{
    const need=q*mult;
    if(rid[0]==='i'){ const i=gIns(rid); if(i) i.estoque=Math.max(0,i.estoque-need); }
    else baixaEstoque(DB.cfg.unidade,rid,need);
  });
}
function novaProducao(fid){
  const fs=DB.fichas.filter(f=>f.ativo);
  if(!fs.length){ toast('Cadastre uma ficha técnica antes','bad'); return; }
  const f0=gFic(fid)||fs[0];
  sheet('Nova batelada','O app baixa os insumos automaticamente',
    '<div class="f"><label>O que vai produzir</label><select id="pFic">'+
      fs.map(f=>'<option value="'+f.id+'"'+(f.id===f0.id?' selected':'')+'>'+esc(f.nome)+'</option>').join('')+'</select></div>'+
    '<div class="f2"><div class="f"><label>Quantidade prevista</label><input id="pPrev" type="number" inputmode="decimal" value="'+f0.rend+'"></div>'+
    '<div class="f"><label>Quantidade real</label><input id="pReal" type="number" inputmode="decimal" value="'+f0.rend+'"></div></div>'+
    '<div class="f2"><div class="f"><label>Lote</label><input id="pLote" value="'+novoLote()+'"></div>'+
    '<div class="f"><label>Validade</label><input id="pVal" type="date" value="'+new Date(Date.now()+90*864e5).toISOString().slice(0,10)+'"></div></div>'+
    '<div class="f"><label>Observação</label><input id="pObs" placeholder="opcional"></div>'+
    '<div id="pCheck"></div>'+
    '<button class="btn" id="pSalvar" style="margin-top:6px">'+ic('check',18)+' Registrar produção</button>');
  const upd=()=>{
    const f=gFic(val('pFic')); if(!f)return;
    const mult=nval('pPrev')/(f.rend||1);
    const falta=disponibilidade(f,mult);
    const custo=custoFicha(f)*mult;
    $('#pCheck').innerHTML='<div class="card" style="padding:14px;margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700">'+
      '<span style="color:var(--muted)">Custo da batelada</span><span class="mono">'+money(custo)+'</span></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:7px">'+
      '<span style="color:var(--muted)">Custo por '+f.un+'</span><span class="mono">'+money(nval('pReal')?custo/nval('pReal'):0)+'</span></div>'+
      (falta.length?'<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
        '<div style="font-size:11px;font-weight:800;color:var(--bad);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Insumo insuficiente</div>'+
        falta.map(x=>'<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+esc(x.nome)+' — precisa '+num(x.need,2)+x.un+', tem '+num(x.tem,2)+x.un+'</div>').join('')+
        '</div>':'<div style="margin-top:10px"><span class="tag ok">insumos disponíveis</span></div>')+'</div>';
  };
  $('#pFic').onchange=()=>{const f=gFic(val('pFic'));$('#pPrev').value=f.rend;$('#pReal').value=f.rend;upd();};
  ['pPrev','pReal'].forEach(id=>$('#'+id).oninput=upd);
  upd();
  $('#pSalvar').onclick=()=>{
    const f=gFic(val('pFic')); const prev=nval('pPrev'), real=nval('pReal');
    if(!f||prev<=0||real<=0){ toast('Preencha as quantidades','bad'); return; }
    const mult=prev/(f.rend||1);
    const falta=disponibilidade(f,mult);
    if(falta.length && !confirm('Faltam insumos ('+falta[0].nome+'). Registrar mesmo assim? O estoque ficará zerado nesses itens.')) return;
    consumir(f,mult);
    const lote=val('pLote')||novoLote();
    addEstoque(DB.cfg.unidade,f.id,lote,real,val('pVal'));
    DB.producoes.push({id:uid(),fid:f.id,lote,data:hoje(),ts:Date.now(),prev,real,
      custo:custoFicha(f)*mult,quem:quem(),obs:val('pObs'),uid:DB.cfg.unidade});
    save(); fecha(); vibra(18);
    const r=real/prev*100;
    toast(r<92?'Registrado — rendimento '+num(r,0)+'%, abaixo do padrão':'Batelada registrada · lote '+lote, r<92?'bad':'ok');
    go('prod');
  };
}
function verProducao(id){
  const p=DB.producoes.find(x=>x.id===id); if(!p)return;
  const f=gFic(p.fid)||{nome:'—',un:'',itens:[]};
  const mult=p.prev/(f.rend||1), r=p.real/p.prev*100;
  sheet(f.nome,'Lote '+p.lote+' · '+fmtD(p.data),
    '<div class="grid2" style="margin-bottom:14px">'+
      kpi('Rendimento',num(r,0)+'%',r<92?'abaixo do padrão':'ok',r<92?'bad':'good')+
      kpi('Custo/'+f.un,money(p.real?p.custo/p.real:0),'nesta batelada','brand')+'</div>'+
    '<div class="sec" style="margin-top:0">Consumo previsto</div>'+
    f.itens.map(([rid,q])=>{const n=rid[0]==='i'?(gIns(rid)||{}).nome:(gFic(rid)||{}).nome+' (semi)';
      const u=rid[0]==='i'?(gIns(rid)||{}).un:(gFic(rid)||{}).un;
      return '<div class="item" style="margin-bottom:6px"><div class="bd"><div class="t" style="font-size:13px">'+esc(n)+'</div></div>'+
      '<div class="rt"><div class="rv mono" style="font-size:13px">'+num(q*mult,2)+u+'</div></div></div>';}).join('')+
    (p.obs?'<div class="card" style="margin-top:12px;font-size:12.5px;color:var(--muted)">'+esc(p.obs)+'</div>':'')+
    '<div style="font-size:11.5px;color:var(--muted-2);margin-top:14px;text-align:center">Registrado por '+esc(p.quem)+' · '+fmtDH(p.ts)+'</div>');
}

/* =====================================================================
   INSUMOS
   ===================================================================== */
function abrirInsumo(id){
  const i=gIns(id); if(!i)return;
  const usado=DB.fichas.filter(f=>f.itens.some(([r])=>r===id));
  sheet(i.nome,money(i.custo)+'/'+i.un+(i.forn?' · '+i.forn:''),
    '<div class="grid2" style="margin-bottom:14px">'+
      kpi('Em estoque',num(i.estoque,1)+' '+i.un,'mínimo '+num(i.min,0),i.estoque<i.min?'warn':'good')+
      kpi('Valor parado',money(i.estoque*i.custo),'a preço de compra','brand')+'</div>'+
    '<div class="btnrow" style="margin-top:0"><button class="btn" id="iEntrada">'+ic('plus',17)+' Entrada</button>'+
    '<button class="btn ghost" id="iEditar">'+ic('edit',17)+' Editar</button></div>'+
    (usado.length?'<div class="sec">Usado em</div>'+usado.map(f=>'<div class="item" style="margin-bottom:6px"><div class="bd">'+
      '<div class="t" style="font-size:13px">'+esc(f.nome)+'</div></div></div>').join(''):'')+
    (i.hist&&i.hist.length?'<div class="sec">Últimas compras</div>'+i.hist.slice(-5).reverse().map(h=>
      '<div class="item" style="margin-bottom:6px"><div class="bd"><div class="t" style="font-size:13px">'+num(h.q,1)+' '+i.un+'</div>'+
      '<div class="s">'+fmtD(h.d)+(h.forn?' · '+esc(h.forn):'')+'</div></div>'+
      '<div class="rt"><div class="rv mono" style="font-size:13px">'+money(h.c)+'</div><div class="rs">un</div></div></div>').join(''):''));
  $('#iEntrada').onclick=()=>entradaInsumo(id);
  $('#iEditar').onclick=()=>editarInsumo(id);
}
function entradaInsumo(id){
  const i=gIns(id);
  sheet('Entrada de '+i.nome,'Compra recebida',
    '<div class="f2"><div class="f"><label>Quantidade ('+i.un+')</label><input id="eQ" type="number" inputmode="decimal" autofocus></div>'+
    '<div class="f"><label>Custo por '+i.un+'</label><input id="eC" type="number" inputmode="decimal" value="'+i.custo+'"></div></div>'+
    '<div class="f"><label>Fornecedor</label><input id="eF" value="'+esc(i.forn)+'"></div>'+
    '<div id="eAviso"></div>'+
    '<button class="btn" id="eSalvar">'+ic('check',18)+' Dar entrada</button>');
  $('#eC').oninput=()=>{
    const novo=nval('eC'), dif=i.custo?((novo-i.custo)/i.custo*100):0;
    $('#eAviso').innerHTML=Math.abs(dif)>=5?'<div class="alert '+(dif>0?'warn':'ok')+'" style="margin-bottom:12px">'+
      ic('alert',17,'var(--'+(dif>0?'warn':'ok')+')')+'<div style="flex:1"><div class="at">Custo '+(dif>0?'subiu':'caiu')+' '+num(Math.abs(dif),0)+'%</div>'+
      '<div class="ad">Antes '+money(i.custo)+' · agora '+money(novo)+'. A margem dos itens com este insumo será recalculada.</div></div></div>':'';
  };
  $('#eSalvar').onclick=()=>{
    const q=nval('eQ'), c=nval('eC');
    if(q<=0){ toast('Informe a quantidade','bad'); return; }
    i.estoque+=q; i.custo=c||i.custo; i.forn=val('eF');
    i.hist=i.hist||[]; i.hist.push({d:hoje(),q,c,forn:i.forn});
    save(); fecha(); toast('Entrada registrada · '+num(q,1)+' '+i.un,'ok'); vibra();
    RENDER[VIEW]&&RENDER[VIEW]();
  };
}
function editarInsumo(id){
  const i=id?gIns(id):{id:'',nome:'',un:'kg',estoque:0,min:0,custo:0,cat:'base',forn:'',hist:[]};
  const cats=['base','complemento','cobertura','fruta','embalagem','outro'];
  sheet(id?'Editar insumo':'Novo insumo','',
    '<div class="f"><label>Nome</label><input id="nI" value="'+esc(i.nome)+'" autofocus></div>'+
    '<div class="f3"><div class="f"><label>Unidade</label><select id="nU">'+
      ['kg','L','un','cx'].map(u=>'<option'+(i.un===u?' selected':'')+'>'+u+'</option>').join('')+'</select></div>'+
    '<div class="f"><label>Estoque</label><input id="nE" type="number" inputmode="decimal" value="'+i.estoque+'"></div>'+
    '<div class="f"><label>Mínimo</label><input id="nM" type="number" inputmode="decimal" value="'+i.min+'"></div></div>'+
    '<div class="f2"><div class="f"><label>Custo unitário</label><input id="nC" type="number" inputmode="decimal" value="'+i.custo+'"></div>'+
    '<div class="f"><label>Categoria</label><select id="nCat">'+cats.map(c=>'<option'+(i.cat===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div></div>'+
    '<div class="f"><label>Fornecedor</label><input id="nF" value="'+esc(i.forn)+'"></div>'+
    '<button class="btn" id="nSalvar">'+ic('check',18)+' Salvar</button>'+
    (id?'<button class="btn danger" id="nExcluir" style="margin-top:9px">Excluir insumo</button>':''));
  $('#nSalvar').onclick=()=>{
    const nome=val('nI'); if(!nome){ toast('Informe o nome','bad'); return; }
    const o={id:i.id||('i'+uid()),nome,un:val('nU'),estoque:nval('nE'),min:nval('nM'),custo:nval('nC'),
      cat:val('nCat'),forn:val('nF'),hist:i.hist||[]};
    if(id){ Object.assign(gIns(id),o); } else DB.insumos.push(o);
    save(); fecha(); toast('Insumo salvo','ok'); RENDER[VIEW]&&RENDER[VIEW]();
  };
  if(id) $('#nExcluir').onclick=()=>{
    if(DB.fichas.some(f=>f.itens.some(([r])=>r===id))){ toast('Insumo usado em ficha técnica','bad'); return; }
    if(!confirm('Excluir '+i.nome+'?'))return;
    DB.insumos=DB.insumos.filter(x=>x.id!==id); save(); fecha(); toast('Excluído'); RENDER[VIEW]&&RENDER[VIEW]();
  };
}
function listaCompra(){
  const L=DB.insumos.filter(i=>i.estoque<i.min);
  const txt='*Lista de compra — Reobote*\n'+hoje().split('-').reverse().join('/')+'\n\n'+
    L.map(i=>'• '+i.nome+': '+num(Math.ceil(i.min*1.5-i.estoque),1)+' '+i.un+(i.forn?'  ('+i.forn+')':'')).join('\n')+
    '\n\nTotal estimado: '+money(L.reduce((s,i)=>s+(i.min*1.5-i.estoque)*i.custo,0));
  sheet('Lista de compra',L.length+' itens abaixo do mínimo',
    '<div class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--cream-2)">'+esc(txt)+'</div>'+
    '<div class="btnrow"><button class="btn" id="lcWpp">'+ic('phone',17)+' Enviar no WhatsApp</button>'+
    '<button class="btn ghost" id="lcCopy">Copiar</button></div>');
  $('#lcWpp').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  $('#lcCopy').onclick=()=>{navigator.clipboard.writeText(txt);toast('Copiado','ok');};
}
</script>

<script>
/* =====================================================================
   FICHAS TÉCNICAS
   ===================================================================== */
let fEdit=null;
function editarFicha(id){
  fEdit=id?JSON.parse(JSON.stringify(gFic(id))):{id:'',nome:'',cat:'sorvete',rend:1,un:'un',itens:[],preco:0,foto:'',ativo:1};
  const cats=[['sorvete','Sorvete'],['acai','Açaí'],['montagem','Montagem/Taça'],['outro','Outro']];
  sheet(id?'Editar produto':'Novo produto','Foto, preço e (se quiser) a receita',
    '<div class="fotobox" id="fFoto"></div>'+
    '<div class="f"><label>Nome</label><input id="fN" value="'+esc(fEdit.nome)+'" placeholder="Ex.: Taça Kinder"></div>'+
    '<div class="f3"><div class="f"><label>Tipo</label><select id="fC">'+
      cats.map(([v,l])=>'<option value="'+v+'"'+(fEdit.cat===v?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
    '<div class="f"><label>Rende</label><input id="fR" type="number" inputmode="decimal" value="'+fEdit.rend+'"></div>'+
    '<div class="f"><label>Unidade</label><select id="fU">'+['L','kg','un'].map(u=>'<option'+(fEdit.un===u?' selected':'')+'>'+u+'</option>').join('')+'</select></div></div>'+
    '<div class="f"><label>Preço de venda (opcional)</label><input id="fP" type="number" inputmode="decimal" value="'+(fEdit.preco||'')+'" placeholder="deixe vazio se for semiacabado"></div>'+
    '<div class="sec" style="margin-left:0">Receita<span class="sp"></span><button id="fAdd">+ ingrediente</button></div>'+
    '<div id="fItens"></div><div id="fResumo"></div>'+
    '<button class="btn" id="fSalvar" style="margin-top:14px">'+ic('check',18)+' Salvar produto</button>'+
    (id?'<button class="btn danger" id="fExcluir" style="margin-top:9px">Excluir produto</button>':''));
  campoFoto('fFoto',fEdit.foto,v=>{fEdit.foto=v;});
  const opts=()=>DB.insumos.map(i=>'<option value="'+i.id+'">'+esc(i.nome)+' ('+i.un+')</option>').join('')+
    DB.fichas.filter(f=>f.id!==fEdit.id&&f.cat!=='montagem').map(f=>'<option value="'+f.id+'">'+esc(f.nome)+' — semi ('+f.un+')</option>').join('');
  const drawItens=()=>{
    $('#fItens').innerHTML=fEdit.itens.length?fEdit.itens.map(([rid,q],ix)=>{
      const r=rid[0]==='i'?gIns(rid):gFic(rid);
      const un=r?r.un:'';
      return '<div class="item" style="margin-bottom:7px;padding:11px 12px">'+
        '<div class="bd"><select data-fi="'+ix+'" style="width:100%;background:transparent;border:none;color:var(--cream);font-size:13.5px;font-weight:700;padding:0;outline:none">'+
        opts().replace('value="'+rid+'"','value="'+rid+'" selected')+'</select>'+
        '<div class="s">'+money(rid[0]==='i'?(r?r.custo*q:0):(r?custoUnit(r)*q:0))+' nesta receita</div></div>'+
        '<input data-fq="'+ix+'" type="number" inputmode="decimal" value="'+q+'" style="width:74px;text-align:right;padding:9px;border-radius:11px;background:var(--plum-850);border:1px solid var(--line);color:var(--cream);font-size:13px">'+
        '<div style="font-size:11px;color:var(--muted-2);width:20px">'+un+'</div>'+
        '<button data-fx="'+ix+'" style="width:30px;height:30px;display:grid;place-items:center">'+ic('close',15,'var(--bad)')+'</button></div>';
    }).join(''):'<div style="font-size:12px;color:var(--muted-2);padding:10px 4px;line-height:1.5">'+
      'Sem receita cadastrada. Dá para salvar assim mesmo — mas aí o app não baixa insumo '+
      'sozinho nem calcula o custo deste produto.</div>';
    const rend=nval('fR')||1, custo=custoFicha(fEdit), cu=custo/rend, preco=nval('fP');
    $('#fResumo').innerHTML='<div class="card" style="margin-top:12px;padding:14px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px">'+
      '<span style="color:var(--muted)">Custo total da receita</span><span class="mono">'+money(custo)+'</span></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700">'+
      '<span style="color:var(--muted)">Custo por '+val('fU')+'</span><span class="mono" style="color:var(--orange-soft)">'+money(cu)+'</span></div>'+
      (preco>0?'<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">'+
        '<span style="color:var(--muted)">Margem</span><span class="mono" style="color:var(--'+((preco-cu)/preco*100<45?'bad':(preco-cu)/preco*100<60?'warn':'ok')+')">'+
        num((preco-cu)/preco*100,0)+'% · '+money(preco-cu)+'</span></div>':'')+'</div>';
    $$('[data-fi]').forEach(s=>s.onchange=e=>{fEdit.itens[+e.target.dataset.fi][0]=e.target.value;drawItens();});
    $$('[data-fq]').forEach(s=>s.oninput=e=>{fEdit.itens[+e.target.dataset.fq][1]=parseFloat(e.target.value.replace(',','.'))||0;drawItens();});
    $$('[data-fx]').forEach(s=>s.onclick=e=>{fEdit.itens.splice(+e.currentTarget.dataset.fx,1);drawItens();});
  };
  $('#fAdd').onclick=()=>{fEdit.itens.push([DB.insumos[0].id,1]);drawItens();};
  ['fR','fP','fU'].forEach(x=>{const e=$('#'+x); e.oninput=drawItens; e.onchange=drawItens;});
  drawItens();
  $('#fSalvar').onclick=()=>{
    const nome=val('fN'); if(!nome){ toast('Informe o nome','bad'); return; }
    const o={id:fEdit.id||('f'+uid()),nome,cat:val('fC'),rend:nval('fR')||1,un:val('fU'),
      itens:fEdit.itens.filter(([,q])=>q>0),preco:nval('fP'),foto:fEdit.foto||'',ativo:1};
    if(id) Object.assign(gFic(id),o); else DB.fichas.push(o);
    save(); fecha(); toast('Produto salvo','ok'); RENDER[VIEW]&&RENDER[VIEW]();
  };
  if(id) $('#fExcluir').onclick=()=>{ if(!confirm('Excluir ficha?'))return;
    DB.fichas=DB.fichas.filter(x=>x.id!==id); save(); fecha(); toast('Excluída'); RENDER[VIEW]&&RENDER[VIEW](); };
}
function abrirFicha(id){
  const f=gFic(id); if(!f)return; const m=margem(f);
  sheet(f.nome,custoUnit(f)>0?'Rende '+num(f.rend,1)+f.un+' · custo '+money(custoUnit(f))+'/'+f.un
    :(f.preco?money(f.preco)+' de venda':'sem preço cadastrado'),
    (f.foto?'<div class="fotohead"><img src="'+f.foto+'" alt=""></div>':'')+
    (m?'<div class="grid2" style="margin-bottom:14px">'+
      kpi('Margem',num(m.pct,0)+'%',money(m.lucro)+' por '+f.un,m.pct<45?'bad':m.pct<60?'warn':'good')+
      kpi('Preço sugerido',money(custoUnit(f)/0.35),'para 65% de margem','brand')+'</div>':'')+
    (f.itens.length?'<div class="sec" style="margin-top:0">Composição</div>':
      '<div class="alert warn" style="margin-top:4px">'+ic('alert',17,'var(--warn)')+
      '<div style="flex:1"><div class="at">Produto sem receita</div><div class="ad">'+
      'Cadastre os ingredientes para o app baixar o estoque sozinho e calcular o custo real.</div></div></div>')+
    f.itens.map(([rid,q])=>{const r=rid[0]==='i'?gIns(rid):gFic(rid);
      const c=rid[0]==='i'?(r?r.custo*q:0):(r?custoUnit(r)*q:0);
      return '<div class="item" style="margin-bottom:6px"><div class="bd"><div class="t" style="font-size:13px">'+esc(r?r.nome:'—')+'</div>'+
      '<div class="s">'+num(q,3)+' '+(r?r.un:'')+'</div></div><div class="rt"><div class="rv mono" style="font-size:13px">'+money(c)+'</div>'+
      '<div class="rs">'+num(custoFicha(f)?c/custoFicha(f)*100:0,0)+'%</div></div></div>';}).join('')+
    '<div class="btnrow"><button class="btn" id="fcProd">'+ic('prod',17)+' Produzir</button>'+
    '<button class="btn ghost" id="fcEdit">'+ic('edit',17)+' Editar</button></div>');
  $('#fcProd').onclick=()=>novaProducao(id);
  $('#fcEdit').onclick=()=>editarFicha(id);
}

/* =====================================================================
   PERDAS
   ===================================================================== */
function novaPerda(fid){
  const fs=DB.fichas.filter(f=>f.ativo);
  sheet('Registrar perda','Perda registrada é perda que dá pra reduzir',
    '<div class="f"><label>Item</label><select id="lF">'+fs.map(f=>'<option value="'+f.id+'"'+(f.id===fid?' selected':'')+'>'+esc(f.nome)+'</option>').join('')+'</select></div>'+
    '<div class="f2"><div class="f"><label>Quantidade</label><input id="lQ" type="number" inputmode="decimal" value="1"></div>'+
    '<div class="f"><label>Unidade</label><select id="lU">'+DB.unidades.map(u=>'<option value="'+u.id+'"'+(DB.cfg.unidade===u.id?' selected':'')+'>'+esc(u.nome)+'</option>').join('')+'</select></div></div>'+
    '<div class="f"><label>Motivo</label><div class="chips" id="lMot">'+
      MOTIVOS.map((m,ix)=>'<button class="chip'+(ix===0?' on':'')+'" data-mot="'+esc(m)+'">'+m+'</button>').join('')+'</div></div>'+
    '<div class="f"><label>Observação</label><input id="lO" placeholder="opcional"></div>'+
    '<div id="lVal"></div>'+
    '<button class="btn" id="lSalvar">'+ic('check',18)+' Registrar perda</button>');
  let motivo=MOTIVOS[0];
  const upd=()=>{const f=gFic(val('lF'));
    $('#lVal').innerHTML='<div class="card" style="margin-bottom:14px;padding:13px;display:flex;justify-content:space-between;font-size:13px;font-weight:700">'+
      '<span style="color:var(--muted)">Prejuízo estimado</span><span class="mono" style="color:var(--bad)">'+money(custoUnit(f)*nval('lQ'))+'</span></div>';};
  $('#lF').onchange=upd; $('#lQ').oninput=upd; upd();
  $$('#lMot .chip').forEach(c=>c.onclick=()=>{$$('#lMot .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');motivo=c.dataset.mot;});
  $('#lSalvar').onclick=()=>{
    const f=gFic(val('lF')), q=nval('lQ');
    if(!f||q<=0){ toast('Informe a quantidade','bad'); return; }
    const u=val('lU');
    baixaEstoque(u,f.id,q);
    DB.perdas.push({id:uid(),fid:f.id,uid:u,qtd:q,motivo,valor:custoUnit(f)*q,data:hoje(),ts:Date.now(),quem:quem(),obs:val('lO')});
    save(); fecha(); vibra(); toast('Perda registrada · '+money(custoUnit(f)*q),'bad'); RENDER[VIEW]&&RENDER[VIEW]();
  };
}

/* =====================================================================
   CADEIA DE FRIO
   ===================================================================== */
function medirTemp(fzid){
  const f=gFz(fzid);
  sheet('Leitura · '+f.cod,f.local+' · alvo '+f.alvo+'°C',
    '<div class="f"><label>Temperatura lida (°C)</label><input id="tT" type="number" inputmode="decimal" step="0.1" value="'+f.alvo+'" autofocus style="font-size:30px;text-align:center;font-weight:800;padding:20px"></div>'+
    '<div id="tAviso"></div>'+
    '<div class="f"><label>Observação</label><input id="tO" placeholder="opcional"></div>'+
    '<button class="btn" id="tSalvar">'+ic('check',18)+' Registrar leitura</button>');
  const upd=()=>{const t=nval('tT'), d=t-f.alvo;
    $('#tAviso').innerHTML=d>3?'<div class="alert bad" style="margin-bottom:14px">'+ic('alert',17,'var(--bad)')+
      '<div style="flex:1"><div class="at">Acima da faixa segura</div><div class="ad">'+num(d,1)+'°C acima do alvo. Verifique a vedação, o degelo e a carga do freezer antes de registrar.</div></div></div>'
      :d>1?'<div class="alert warn" style="margin-bottom:14px">'+ic('alert',17,'var(--warn)')+
      '<div style="flex:1"><div class="at">Levemente acima</div><div class="ad">Fique de olho na próxima leitura.</div></div></div>'
      :'<div class="alert ok" style="margin-bottom:14px">'+ic('check',17,'var(--ok)')+
      '<div style="flex:1"><div class="at">Dentro da faixa</div><div class="ad">Temperatura adequada para conservação.</div></div></div>';};
  $('#tT').oninput=upd; upd();
  $('#tSalvar').onclick=()=>{
    DB.temps.push({id:uid(),fzid,temp:nval('tT'),data:new Date().toISOString(),quem:quem(),obs:val('tO')});
    save(); fecha(); vibra(); toast('Leitura registrada','ok'); RENDER[VIEW]&&RENDER[VIEW]();
  };
}
function abrirFreezer(id){
  const f=gFz(id);
  const L=DB.temps.filter(t=>t.fzid===id).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,12);
  sheet(f.cod,f.local+' · alvo '+f.alvo+'°C',
    '<button class="btn" id="fzMedir">'+ic('thermo',18)+' Registrar temperatura</button>'+
    (f.tipo==='comodato'?'<div class="card" style="margin-top:12px"><div style="font-size:11px;font-weight:800;color:var(--muted-2);'+
      'text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">Comodato</div>'+
      '<div style="font-size:13.5px;font-weight:700">'+esc(f.cliente||'—')+'</div></div>':'')+
    '<div class="sec">Últimas leituras</div>'+
    (L.length?L.map(t=>{const d=t.temp-f.alvo, cls=d>3?'bad':d>1?'warn':'ok';
      return '<div class="item" style="margin-bottom:6px"><div class="ic">'+ic('thermo',17,'var(--'+cls+')')+'</div>'+
      '<div class="bd"><div class="t" style="font-size:13px">'+fmtDH(t.data)+'</div><div class="s">'+esc(t.quem)+(t.obs?' · '+esc(t.obs):'')+'</div></div>'+
      '<div class="rt"><div class="rv mono" style="color:var(--'+cls+')">'+num(t.temp,1)+'°</div></div></div>';}).join('')
      :'<div style="font-size:12px;color:var(--muted-2);padding:8px 4px">Nenhuma leitura ainda.</div>')+
    '<button class="btn ghost sm" id="fzEdit" style="width:100%;margin-top:12px">'+ic('edit',16)+' Editar equipamento</button>');
  $('#fzMedir').onclick=()=>medirTemp(id);
  $('#fzEdit').onclick=()=>editarFreezer(id);
}
function editarFreezer(id){
  const f=id?gFz(id):{id:'',cod:'FZ-'+String(DB.freezers.length+1).padStart(2,'0'),local:'',tipo:'proprio',
    uid:DB.cfg.unidade,cliente:'',cidade:'Poços de Caldas',alvo:-18};
  sheet(id?'Editar freezer':'Novo freezer','',
    '<div class="f2"><div class="f"><label>Código / patrimônio</label><input id="zC" value="'+esc(f.cod)+'"></div>'+
    '<div class="f"><label>Alvo (°C)</label><input id="zA" type="number" value="'+f.alvo+'"></div></div>'+
    '<div class="f"><label>Onde está</label><input id="zL" value="'+esc(f.local)+'" placeholder="Ex.: Padaria Estrela — entrada"></div>'+
    '<div class="f"><label>Cidade</label><input id="zCid" value="'+esc(f.cidade||'')+'" placeholder="Poços de Caldas"></div>'+
    '<div class="f"><label>Tipo</label><div class="chips" id="zT">'+
      [['proprio','Em unidade nossa'],['comodato','Cedido a cliente']].map(([v,l])=>
      '<button class="chip'+(f.tipo===v?' on':'')+'" data-tp="'+v+'">'+l+'</button>').join('')+'</div></div>'+
    '<div class="f'+(f.tipo==='comodato'?' hide':'')+'" id="zUnW"><label>Unidade</label><select id="zUn">'+
      DB.unidades.map(u=>'<option value="'+u.id+'"'+(f.uid===u.id?' selected':'')+'>'+esc(u.nome)+'</option>').join('')+'</select></div>'+
    '<div class="f'+(f.tipo==='comodato'?'':' hide')+'" id="zCliW"><label>Cliente</label>'+
      (DB.clientes.length?'<select id="zCli">'+
      DB.clientes.map(c=>'<option value="'+c.id+'"'+(f.cliente===c.id?' selected':'')+'>'+esc(c.nome)+'</option>').join('')+'</select>'
      :'<div class="hint" style="margin:0">Cadastre o cliente primeiro em Mais → Clientes.</div>')+'</div>'+
    '<button class="btn" id="zSalvar">'+ic('check',18)+' Salvar</button>'+
    (id?'<button class="btn danger" id="zDel" style="margin-top:9px">Excluir</button>':''));
  let tipo=f.tipo;
  $$('#zT .chip').forEach(c=>c.onclick=()=>{$$('#zT .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    tipo=c.dataset.tp; $('#zCliW').classList.toggle('hide',tipo!=='comodato');
    $('#zUnW').classList.toggle('hide',tipo==='comodato');});
  $('#zSalvar').onclick=()=>{
    const o={id:f.id||('fz'+uid()),cod:val('zC'),local:val('zL'),tipo,cidade:val('zCid'),
      uid:tipo==='comodato'?'':val('zUn'),
      cliente:tipo==='comodato'?val('zCli'):'',alvo:nval('zA')||-18};
    if(id) Object.assign(gFz(id),o); else DB.freezers.push(o);
    save(); fecha(); toast('Freezer salvo','ok'); RENDER[VIEW]&&RENDER[VIEW]();
  };
  if(id) $('#zDel').onclick=()=>{ if(!confirm('Excluir freezer?'))return;
    DB.freezers=DB.freezers.filter(x=>x.id!==id); save(); fecha(); RENDER[VIEW]&&RENDER[VIEW](); };
}
</script>

<script>
/* =====================================================================
   TRANSFERÊNCIAS
   ===================================================================== */
let tItens=[];
function novaTransf(){
  tItens=[];
  const outras=DB.unidades.filter(u=>u.id!==DB.cfg.unidade);
  if(!outras.length){ toast('Cadastre outra unidade primeiro','bad'); return; }
  sheet('Nova transferência','Sai de '+gUn(DB.cfg.unidade).nome,
    '<div class="f"><label>Destino</label><select id="trPara">'+outras.map(u=>'<option value="'+u.id+'">'+esc(u.nome)+'</option>').join('')+'</select></div>'+
    '<div class="sec" style="margin-left:0">Itens<span class="sp"></span><button id="trAdd">+ adicionar</button></div>'+
    '<div id="trItens"></div>'+
    '<button class="btn" id="trSalvar" style="margin-top:14px">'+ic('truck',18)+' Enviar transferência</button>');
  const draw=()=>{
    $('#trItens').innerHTML=tItens.length?tItens.map((it,ix)=>{
      const f=gFic(it.fid)||{nome:'—',un:''};
      const disp=estoqueDe(it.fid,DB.cfg.unidade);

function divergencia(t){
  sheet('Conferência','Informe o que realmente chegou',

      return '<div class="f"><label>'+esc(f.nome)+' — enviado '+num(it.qtd,1)+f.un+'</label>'+
      '<input data-dv="'+ix+'" type="number" inputmode="decimal" value="'+it.qtd+'"></div>';}).join('')+

    '<button class="btn" id="dvSalvar">'+ic('check',18)+' Registrar recebimento</button>');
  $('#dvSalvar').onclick=()=>{
    let div=false;
    t.itens.forEach((it,ix)=>{
      const r=parseFloat(($('[data-dv="'+ix+'"]')||{}).value)||0;
      it.recebido=r; if(Math.abs(r-it.qtd)>0.001) div=true;
      if(r>0) addEstoque(t.para,it.fid,'TR-'+t.id.slice(0,4),r,'');
    });
    t.status=div?'divergencia':'recebido'; t.recebidoEm=hoje(); t.recebidoPor=quem(); t.obs=val('dvO');
    save(); fecha(); toast(div?'Divergência registrada':'Recebimento confirmado',div?'bad':'ok'); go('transf');
  };
}

function exportar(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='reobote-backup-'+hoje()+'.json'; a.click();
  toast('Backup gerado','ok');
}
function importar(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.insumos) throw 0;
      if(!confirm('Substituir todos os dados atuais pelo backup?'))return;
      DB=d; save(); toast('Backup restaurado','ok'); go('home');
    }catch(e){ toast('Arquivo inválido','bad'); } };
    r.readAsText(f);};
  inp.click();
}

let pin='';
function drawPin(){
  $('#pins').innerHTML=[0,1,2,3].map(i=>'<div class="pin'+(i<pin.length?' on':'')+'"></div>').join('');
}
function tecla(k){
  vibra(8);
  if(k==='del'){ pin=pin.slice(0,-1); drawPin(); return; }
  if(pin.length>=4) return;
  pin+=k; drawPin();
  if(pin.length===4) setTimeout(confereSenha,140);
}
function confereSenha(){
  if(pin===SENHA_FIN){

    setTimeout(()=>{$('#lock').classList.remove('shake'); pin=''; drawPin();},430);
    $('#lockSub').textContent='Senha incorreta — tente de novo';
  }
}

  pin=''; drawPin();
  $('#lockSub').textContent='Área restrita — digite a senha';
  $('#lock').style.display='flex';
}
