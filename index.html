  $('#btnMais').onclick=()=>go('mais');

  /* botões fixos */
  const B={btnNovaProd:()=>novaProducao(),btnNovoInsumo:()=>editarInsumo(),btnNovaFicha:()=>editarFicha(),
    btnNovaTransf:novaTransf,btnNovaPerda:()=>novaPerda(),btnNovoFreezer:()=>editarFreezer(),
    btnNovoCliente:()=>editarCliente(),btnNovoPed:()=>novoPedido(),
    btnUnidSel:()=>$('#btnUser').onclick()};
  Object.entries(B).forEach(([id,fn])=>{const e=$('#'+id); if(e) e.onclick=fn;});

  /* delegação geral */
  document.addEventListener('click',e=>{
    const t=e.target;
    const q=s=>t.closest(s);
    let el;
    if(el=q('[data-go]')) return go(el.dataset.go);
    if(el=q('[data-back]')) return go(el.dataset.back);
    if(el=q('[data-quick]')){ const v=el.dataset.quick;
      if(v==='prod') return novaProducao();
      if(v==='perdas') return novaPerda();
      if(v==='transf') return novaTransf();
      if(v==='frio'){ const f=DB.freezers.find(x=>!DB.temps.some(t2=>t2.fzid===x.id&&t2.data.slice(0,10)===hoje()))||DB.freezers[0];
        return f?medirTemp(f.id):toast('Cadastre um freezer','bad'); }
    }
    if(el=q('[data-al]')){ const A=$('#homeAlerts')._A; return A&&A[+el.dataset.al].go(); }
    if(el=q('[data-alz]')){ const A=$('#shBody')._A; fecha(); return A&&A[+el.dataset.alz].go(); }
    if(el=q('[data-prod]')) return verProducao(el.dataset.prod);
    if(el=q('[data-ins]')) return abrirInsumo(el.dataset.ins);
    if(el=q('[data-fic]')) return abrirFicha(el.dataset.fic);
    if(el=q('[data-estf]')) return abrirFicha(el.dataset.estf);
    if(el=q('[data-tr]')) return abrirTransf(el.dataset.tr);
    if(el=q('[data-fz]')) return abrirFreezer(el.dataset.fz);
    if(el=q('[data-cli]')) return abrirCliente(el.dataset.cli);
    if(el=q('[data-ped]')) return abrirPedido(el.dataset.ped);
    if(el=q('[data-esttab]')){ estTab=el.dataset.esttab; return RENDER.est(); }
    if(el=q('[data-pedtab]')){ pedTab=el.dataset.pedtab; return RENDER.ped(); }
    if(t.closest('#btnSair')) return trocarUnidade();
    if(t.closest('#btnListaCompra')) return listaCompra();
    if(t.closest('#btnExport')) return exportar();
    if(t.closest('#btnImport')) return importar();
    if(t.closest('#btnReset')){ if(confirm('Apagar TODOS os dados e voltar ao inicial?')){ DB=seed(); save(); toast('Zerado'); go('home'); } return; }
    if(t.closest('#cfgSalvar')){ DB.cfg.unidade=val('cfgUn'); DB.cfg.metaLitrosDia=nval('cfgMeta');
      DB.cfg.alertaValidade=nval('cfgVal'); save(); toast('Configurações salvas','ok'); return RENDER.config(); }
    if(t.closest('#btnNovaUnid')){
      const n=prompt('Nome da nova unidade:'); if(!n)return;
      DB.unidades.push({id:'u'+uid(),nome:n,tipo:'loja'}); save(); RENDER.config(); return;
    }
  });

  /* app abre livre; financeiro lembra se já foi destravado nesta sessão */
  try{ finLiberado=sessionStorage.getItem('reobote_fin')==='1'; }catch(e){}
  fechaCadeado();
  go('home');

  /* PWA */
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>

<script>
/* =====================================================================
   IMPORTAÇÃO DE PEDIDO VINDO DO PORTAL DO CLIENTE
   O portal gera um link index.html#p=<pedido>. Ao abrir, o app oferece
   lançar com 1 toque — sem redigitar nada.
   ===================================================================== */
function checaImport(){
  const m=(location.hash||'').match(/[#&]p=([^&]+)/);
  if(!m) return;
  let ped;
  try{ ped=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); }
  catch(e){ toast('Link de pedido inválido','bad'); history.replaceState(null,'',location.pathname); return; }
  if(!ped||!ped.itens||!ped.itens.length){ history.replaceState(null,'',location.pathname); return; }

  const jaExiste=DB.pedidos.some(p=>p.origemTs===ped.ts);
  if(jaExiste){ toast('Este pedido já foi lançado'); history.replaceState(null,'',location.pathname); return; }

  const semFicha=ped.itens.filter(i=>!gFic(i.fid));
  sheet('Pedido do portal',esc(ped.loja)+' · '+fmtDH(ped.ts),
    ped.itens.map(i=>{const f=gFic(i.fid);
      const falta=f?estoqueDe(f.id,DB.cfg.unidade)<i.qtd:false;
      return '<div class="item" style="margin-bottom:6px"><div class="bd">'+
        '<div class="t" style="font-size:13.5px">'+esc(f?f.nome:i.nome)+'</div>'+
        '<div class="s"'+(falta?' style="color:var(--bad)"':'')+'>'+money(i.preco)+' un'+
        (f?(falta?' · estoque insuficiente':''):' · sem ficha cadastrada')+'</div></div>'+
        '<div class="rt"><div class="rv mono">'+num(i.qtd,1)+'</div><div class="rs">'+money(i.qtd*i.preco)+'</div></div></div>';
    }).join('')+
    '<div class="card" style="margin-top:12px">'+
      '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800">'+
      '<span>Total</span><span class="mono">'+money(ped.total)+'</span></div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5">'+
      (ped.resp?esc(ped.resp)+' · ':'')+esc(ped.tel)+'<br>Entrega pedida para '+fmtD(ped.data)+
      (ped.obs?'<br><span style="color:var(--warn)">Obs: '+esc(ped.obs)+'</span>':'')+'</div></div>'+
    (semFicha.length?'<div class="alert warn" style="margin-top:12px">'+ic('alert',17,'var(--warn)')+
      '<div style="flex:1"><div class="at">'+semFicha.length+' item(ns) sem ficha</div>'+
      '<div class="ad">Serão lançados pelo preço enviado, mas sem baixa de estoque até você cadastrar a ficha.</div></div></div>':'')+
    '<button class="btn" id="impOk" style="margin-top:14px">'+ic('check',18)+' Lançar pedido</button>'+
    '<button class="btn ghost" id="impNao" style="margin-top:9px">Descartar</button>');

  const limpar=()=>{ history.replaceState(null,'',location.pathname); fecha(); };
  $('#impNao').onclick=limpar;
  $('#impOk').onclick=()=>{
    let c=DB.clientes.find(x=>x.nome.toLowerCase()===String(ped.loja).toLowerCase());
    if(!c){ c={id:'c'+uid(),nome:ped.loja,contato:ped.tel||'',end:'',tipo:'revenda',ativo:1}; DB.clientes.push(c); }
    else if(ped.tel && !c.contato){ c.contato=ped.tel; }
    DB.pedidos.push({id:uid(),cid:c.id,itens:ped.itens.map(i=>({fid:i.fid,qtd:i.qtd,preco:i.preco})),
      status:'novo',data:new Date().toISOString(),ts:Date.now(),origemTs:ped.ts,total:ped.total,
      origem:'portal',entrega:ped.data,obs:ped.obs||'',quem:ped.resp||ped.loja});
    save(); limpar(); vibra(20); toast('Pedido lançado · '+ped.loja,'ok'); go('ped');
  };
}
setTimeout(checaImport,300);
window.addEventListener('hashchange',checaImport);
</script>

<script>
/* =====================================================================
   FINANCEIRO
   Receita  = vendas lançadas no caixa + pedidos entregues
   Custo    = custo de produção das bateladas do período
   Despesas = contas da operação (aluguel, energia, folha...)
   Perdas   = quebra, vencimento e derretimento, ao custo real
   ===================================================================== */
const CAT_DESP=[['aluguel','Aluguel'],['energia','Energia'],['agua','Água'],['folha','Salários'],
  ['imposto','Impostos'],['manutencao','Manutenção'],['entrega','Entrega/combustível'],
  ['marketing','Marketing'],['outro','Outros']];

let finPer='mes';
function periodo(){
  const h=new Date(), y=h.getFullYear(), m=h.getMonth();
  if(finPer==='mes')      return [new Date(y,m,1), new Date(y,m+1,0), 'Este mês'];
  if(finPer==='anterior') return [new Date(y,m-1,1), new Date(y,m,0), 'Mês passado'];
  if(finPer==='tri')      return [new Date(y,m-2,1), new Date(y,m+1,0), 'Últimos 3 meses'];
  return [new Date(y,0,1), new Date(y,11,31), 'Este ano'];
}
const iso=d=>d.toISOString().slice(0,10);
const dentro=(dt,de,ate)=>{ const d=String(dt||'').slice(0,10); return d>=iso(de)&&d<=iso(ate); };

function resumoFin(de,ate){
  const vendas =DB.caixa.filter(c=>dentro(c.data,de,ate)).reduce((s,c)=>s+c.valor,0);
  const entreg =DB.pedidos.filter(p=>p.status==='entregue'&&dentro(p.data,de,ate)).reduce((s,p)=>s+p.total,0);
  const custo  =DB.producoes.filter(p=>dentro(p.data,de,ate)).reduce((s,p)=>s+(p.custo||0),0);
  const desp   =DB.despesas.filter(d=>dentro(d.data,de,ate)).reduce((s,d)=>s+d.valor,0);
  const perdas =DB.perdas.filter(p=>dentro(p.data,de,ate)).reduce((s,p)=>s+p.valor,0);
  const receita=vendas+entreg;
  const lucro  =receita-custo-desp-perdas;
  return {vendas,entreg,receita,custo,desp,perdas,lucro,margem:receita?lucro/receita*100:0};
}

RENDER.fin=()=>{
  const [de,ate,rot]=periodo();
  const R=resumoFin(de,ate);
  const [de0,ate0]=periodoAnterior();
  const R0=resumoFin(de0,ate0);

  $('#finTabs').innerHTML=[['mes','Este mês'],['anterior','Mês passado'],['tri','3 meses'],['ano','Este ano']]
    .map(([k,l])=>'<button class="chip'+(finPer===k?' on':'')+'" data-fintab="'+k+'">'+l+'</button>').join('');

  const pos=R.lucro>=0;
  const dias_=Math.max(1,Math.round((Math.min(ate,new Date())-de)/864e5)+1);

  /* ---- topo: lucro em destaque ---- */
  $('#finResumo').innerHTML='<div class="hero" style="margin-bottom:10px">'+
    '<div class="hi">'+rot+' · '+(pos?'lucro':'prejuízo')+delta(R.lucro,R0.lucro)+'</div>'+
    '<div class="hn mono" style="color:var(--'+(pos?'ok':'bad')+');font-size:31px">'+money(Math.abs(R.lucro))+'</div>'+
    '<div class="hd">'+
      '<div><div class="hl">Faturamento</div><div class="hv mono">'+money(R.receita).replace('R$ ','R$')+'</div></div>'+
      '<div><div class="hl">Margem</div><div class="hv mono">'+num(R.margem,0)+'<small>%</small></div></div>'+
      '<div><div class="hl">Média/dia</div><div class="hv mono">'+money(R.receita/dias_).replace('R$ ','R$')+'</div></div>'+
    '</div></div>'+
    '<div class="grid2">'+
      kpi('Faturamento',money(R.receita),'vendas + pedidos'+delta(R.receita,R0.receita),'brand','money')+
      kpi('Saídas',money(R.custo+R.desp+R.perdas),'produção, contas e perdas','','trash')+
    '</div>';

  /* ---- para onde foi o dinheiro ---- */
  const base=Math.max(R.receita,R.custo+R.desp+R.perdas,1);
  const hb=(l,v,cor)=>'<div class="hrow"><div class="hl2">'+l+'</div>'+
    '<div class="htrack"><i style="width:'+Math.min(100,Math.abs(v)/base*100)+'%;background:var(--'+cor+')"></i></div>'+
    '<div class="hv2">'+money(v).replace('R$ ','')+'</div></div>';
  $('#finDemo').innerHTML='<div class="card">'+
    '<div style="font-size:11px;font-weight:800;color:var(--muted-2);text-transform:uppercase;'+
    'letter-spacing:.11em;margin-bottom:13px">Para onde foi o faturamento</div>'+
    hb('Entrou',R.receita,'ok')+
    hb('Produção',R.custo,'orange')+
    hb('Despesas',R.desp,'warn')+
    hb('Perdas',R.perdas,'bad')+
    hb(pos?'Sobrou':'Faltou',Math.abs(R.lucro),pos?'ok':'bad')+
    '</div>'+
    '<div class="card" style="margin-top:10px">'+
    '<div style="font-size:11px;font-weight:800;color:var(--muted-2);text-transform:uppercase;'+
    'letter-spacing:.11em;margin-bottom:11px">Linha a linha</div>'+
    dl('Vendas no balcão','fechamento de caixa',R.vendas,'cream','+')+
    dl('Pedidos entregues','revendas e distribuição',R.entreg,'cream','+')+
    dl('Custo de produção','insumo e embalagem',R.custo,'muted','−')+
    dl('Despesas','contas fixas e variáveis',R.desp,'muted','−')+
    dl('Perdas','quebra e vencimento',R.perdas,'bad','−')+
    '</div>';

  /* ---- gráfico 6 meses ---- */
  const hj=new Date(), meses=[];
  for(let i=5;i>=0;i--){
    const d1=new Date(hj.getFullYear(),hj.getMonth()-i,1), d2=new Date(hj.getFullYear(),hj.getMonth()-i+1,0);
    const r=resumoFin(d1,d2);
    meses.push({lb:d1.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),rec:r.receita,luc:r.lucro});
  }
  const topo=Math.max(...meses.map(m=>m.rec),1);
  $('#finGraf').innerHTML='<div class="card" style="padding:10px 12px 14px"><div class="graf">'+
    meses.map(m=>{
      const hRec=Math.max(3,m.rec/topo*100), hLuc=m.rec?Math.max(0,Math.min(100,Math.abs(m.luc)/m.rec*100)):0;
      return '<div class="gcol"><div class="gtrack"><div class="gbar" style="height:'+hRec+'%">'+
        '<i class="'+(m.luc<0?'neg':'')+'" style="height:'+hLuc+'%"></i></div></div><span>'+m.lb+'</span></div>';
    }).join('')+'</div>'+
    '<div style="display:flex;gap:16px;justify-content:center;font-size:10.5px;color:var(--muted-2);font-weight:700;margin-top:6px">'+
    '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--plum-700);margin-right:5px"></i>faturamento</span>'+
    '<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--orange);margin-right:5px"></i>lucro (vermelho = prejuízo)</span></div></div>';

  $('#finAcoes').innerHTML=
    '<button class="qk" id="btnVenda"><div class="qi">'+ic('store',21,'var(--ok)')+'</div><span>Venda do dia<br>(balcão)</span></button>'+
    '<button class="qk" id="btnDespesa2"><div class="qi">'+ic('money',21,'var(--bad)')+'</div><span>Conta<br>a pagar</span></button>';

  /* ---- despesas: composição + lista ---- */
  const L=DB.despesas.filter(d=>dentro(d.data,de,ate)).sort((a,b)=>b.ts-a.ts);
  const porCat={};
  L.forEach(d=>porCat[d.cat]=(porCat[d.cat]||0)+d.valor);
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=Math.max(...cats.map(c=>c[1]),1);
  $('#finDespesas').innerHTML=(cats.length?'<div class="card" style="margin-bottom:10px">'+
      '<div style="font-size:11px;font-weight:800;color:var(--muted-2);text-transform:uppercase;'+
      'letter-spacing:.11em;margin-bottom:13px">Onde pesa mais</div>'+
      cats.map(([c,v])=>{const nome=(CAT_DESP.find(x=>x[0]===c)||['','Outros'])[1];
        return '<div class="hrow"><div class="hl2">'+nome+'</div>'+
          '<div class="htrack"><i style="width:'+(v/maxCat*100)+'%;background:var(--warn)"></i></div>'+
          '<div class="hv2">'+num(R.desp?v/R.desp*100:0,0)+'% · '+money(v).replace('R$ ','')+'</div></div>';}).join('')+
      '</div>':'')+
    (L.length?L.map(d=>{
      const cat=(CAT_DESP.find(c=>c[0]===d.cat)||['','Outros'])[1];
      return '<button class="item" data-desp="'+d.id+'"><div class="ic">'+ic('money',18,'var(--muted)')+'</div>'+
        '<div class="bd"><div class="t">'+esc(d.desc)+'</div><div class="s">'+cat+' · '+fmtD(d.data)+
        (d.fixa?' · <span class="tag">fixa</span>':'')+'</div></div>'+
        '<div class="rt"><div class="rv mono" style="color:var(--bad)">−'+money(d.valor)+'</div></div></button>';
    }).join(''):vazio('money','Nenhuma despesa no período','Lance aluguel, energia e salários para o lucro sair real.'));
};

/* variação contra o período anterior */
function delta(atual,anterior){
  if(!anterior) return '';
  const p=(atual-anterior)/Math.abs(anterior)*100;
  if(!isFinite(p)||Math.abs(p)<1) return '<span class="var flat">estável</span>';
  return '<span class="var '+(p>0?'up':'down')+'">'+(p>0?'▲':'▼')+' '+num(Math.abs(p),0)+'%</span>';
}
const dl=(nome,sub,valor,cor,sinal)=>'<div class="dl"><div class="dn">'+nome+'<small>'+sub+'</small></div>'+
  '<div class="dv mono" style="color:var(--'+cor+')">'+(sinal||'')+money(valor)+'</div></div>';

function periodoAnterior(){
  const h=new Date(), y=h.getFullYear(), m=h.getMonth();
  if(finPer==='mes')      return [new Date(y,m-1,1), new Date(y,m,0)];
  if(finPer==='anterior') return [new Date(y,m-2,1), new Date(y,m-1,0)];
  if(finPer==='tri')      return [new Date(y,m-5,1), new Date(y,m-2,0)];
  return [new Date(y-1,0,1), new Date(y-1,11,31)];
}

function novaDespesa(id){
  const d=id?DB.despesas.find(x=>x.id===id):{id:'',desc:'',cat:'outro',valor:0,data:hoje(),fixa:0};
  sheet(id?'Editar despesa':'Nova despesa','Conta da operação',
    '<div class="f"><label>Descrição</label><input id="dD" value="'+esc(d.desc)+'" placeholder="Ex.: Energia da loja" autofocus></div>'+
    '<div class="f2"><div class="f"><label>Valor</label><input id="dV" type="number" inputmode="decimal" value="'+(d.valor||'')+'"></div>'+
    '<div class="f"><label>Data</label><input id="dT" type="date" value="'+d.data+'"></div></div>'+
    '<div class="f"><label>Categoria</label><select id="dC">'+
      CAT_DESP.map(([v,l])=>'<option value="'+v+'"'+(d.cat===v?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
    '<div class="f"><label>Tipo</label><div class="chips" id="dF">'+
      [[0,'Avulsa'],[1,'Fixa (todo mês)']].map(([v,l])=>
      '<button class="chip'+(d.fixa==v?' on':'')+'" data-df="'+v+'">'+l+'</button>').join('')+'</div></div>'+
    '<button class="btn" id="dSalvar">'+ic('check',18)+' Salvar</button>'+
    (id?'<button class="btn danger" id="dDel" style="margin-top:9px">Excluir</button>':''));
  let fixa=d.fixa;
  $$('#dF .chip').forEach(c=>c.onclick=()=>{$$('#dF .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');fixa=+c.dataset.df;});
  $('#dSalvar').onclick=()=>{
    const desc=val('dD'), v=nval('dV');
    if(!desc||v<=0){ toast('Informe descrição e valor','bad'); return; }
    const o={id:d.id||uid(),desc,cat:val('dC'),valor:v,data:val('dT'),fixa,ts:Date.now(),quem:quem()};
    if(id) Object.assign(DB.despesas.find(x=>x.id===id),o); else DB.despesas.push(o);
    save(); fecha(); toast('Despesa lançada','ok'); RENDER.fin();
  };
  if(id) $('#dDel').onclick=()=>{ if(!confirm('Excluir despesa?'))return;
    DB.despesas=DB.despesas.filter(x=>x.id!==id); save(); fecha(); RENDER.fin(); };
}

function novaVenda(){
  const j=DB.caixa.find(c=>c.data===hoje()&&c.uid===DB.cfg.unidade);
  sheet('Venda do dia','Fechamento de caixa da loja',
    '<div class="f"><label>Unidade</label><select id="vU">'+
      DB.unidades.map(u=>'<option value="'+u.id+'"'+(DB.cfg.unidade===u.id?' selected':'')+'>'+esc(u.nome)+'</option>').join('')+'</select></div>'+
    '<div class="f2"><div class="f"><label>Total vendido</label><input id="vV" type="number" inputmode="decimal" value="'+(j?j.valor:'')+'" autofocus></div>'+
    '<div class="f"><label>Data</label><input id="vD" type="date" value="'+hoje()+'"></div></div>'+
    '<div class="f"><label>Observação</label><input id="vO" placeholder="opcional"></div>'+
    (j?'<div class="alert warn" style="margin-bottom:13px">'+ic('alert',17,'var(--warn)')+
      '<div style="flex:1"><div class="at">Já existe lançamento hoje</div><div class="ad">'+money(j.valor)+
      ' nesta unidade. Salvar substitui o valor.</div></div></div>':'')+
    '<button class="btn ok" id="vSalvar">'+ic('check',18)+' Registrar venda</button>');
  $('#vSalvar').onclick=()=>{
    const v=nval('vV'); if(v<=0){ toast('Informe o valor','bad'); return; }
    const u=val('vU'), dt=val('vD');
    const ex=DB.caixa.find(c=>c.data===dt&&c.uid===u);
    if(ex){ ex.valor=v; ex.obs=val('vO'); ex.ts=Date.now(); }
    else DB.caixa.push({id:uid(),uid:u,data:dt,valor:v,obs:val('vO'),ts:Date.now(),quem:quem()});
    save(); fecha(); vibra(); toast('Venda registrada · '+money(v),'ok'); RENDER.fin();
  };
}
</script>

<script>
/* eventos do financeiro e da equipe */
document.addEventListener('click',e=>{
  const t=e.target, q=sel=>t.closest(sel);
  let el;
  if(q('#btnTrancar'))      return trancarFin();
  if(q('#btnNovaDespesa'))  return novaDespesa();
  if(q('#btnDespesa2'))     return novaDespesa();
  if(q('#btnVenda'))        return novaVenda();
  if(el=q('[data-fintab]')){ finPer=el.dataset.fintab; return RENDER.fin(); }
  if(el=q('[data-desp]'))    return novaDespesa(el.dataset.desp);
});
</script>

<script>
/* =====================================================================
   CATÁLOGO DO PORTAL
   Gera o catalogo.json que o portal do cliente lê. Só entram produtos
   com preço de venda — o resto é semiacabado e não se vende avulso.
   ===================================================================== */
function gerarCatalogo(){
  const prods=DB.fichas.filter(f=>f.ativo&&f.preco>0).map(f=>({
    id:f.id, nome:f.nome, cat:f.cat, un:f.un==='un'?'unidade':f.un,
    preco:f.preco, desc:f.desc||'', foto:f.foto||''
  }));
  if(!prods.length){
    sheet('Catálogo do portal','Nenhum produto com preço',
      vazio('cart','Nada para publicar ainda',
        'Cadastre os produtos e defina o preço de venda de cada um. Só entram no portal os que têm preço.')+
      '<button class="btn" id="cgIr">'+ic('plus',18)+' Cadastrar produto</button>');
    $('#cgIr').onclick=()=>{ fecha(); go('fichas'); editarFicha(); };
    return;
  }
  const json=JSON.stringify(prods,null,2);
  const kb=Math.round(new Blob([json]).size/1024);
  const comFoto=prods.filter(p=>p.foto).length;
  sheet('Catálogo do portal',prods.length+' produtos · '+kb+' KB',
    '<div class="card" style="margin-bottom:12px">'+
      prods.map(p=>'<div style="display:flex;align-items:center;gap:10px;padding:7px 0">'+
        (p.foto?'<img src="'+p.foto+'" style="width:32px;height:32px;border-radius:9px;object-fit:cover">'
              :'<div style="width:32px;height:32px;border-radius:9px;background:var(--plum-850);display:grid;place-items:center">'+
               ic('cup',15,'var(--muted-2)')+'</div>')+
        '<div style="flex:1;font-size:13px;font-weight:700">'+esc(p.nome)+'</div>'+
        '<div class="mono" style="font-size:12.5px;font-weight:800;color:var(--orange-soft)">'+money(p.preco)+'</div></div>').join('')+
    '</div>'+
    (comFoto<prods.length?'<div class="alert warn" style="margin-bottom:12px">'+ic('alert',17,'var(--warn)')+
      '<div style="flex:1"><div class="at">'+(prods.length-comFoto)+' sem foto</div>'+
      '<div class="ad">Produto com foto vende mais no portal. Dá para adicionar depois e gerar de novo.</div></div></div>':'')+
    '<button class="btn" id="cgBaixar">'+ic('down',18)+' Baixar catalogo.json</button>'+
    '<button class="btn ghost" id="cgCopiar" style="margin-top:9px">Copiar conteúdo</button>'+
    '<div class="hint" style="margin-top:12px">Suba o arquivo <b>catalogo.json</b> na mesma pasta do site, '+
    'ao lado do pedidos.html. O portal passa a mostrar esses produtos na hora.</div>');
  $('#cgBaixar').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download='catalogo.json'; a.click();
    toast('catalogo.json gerado','ok');
  };
  $('#cgCopiar').onclick=()=>{ navigator.clipboard.writeText(json); toast('Copiado','ok'); };
}
document.addEventListener('click',e=>{ if(e.target.closest('#btnCatalogo')) gerarCatalogo(); });
</script>

<script>
/* =====================================================================
   PEDIDOS EM TEMPO REAL
   O portal do cliente grava o pedido na nuvem. Este app escuta e avisa
   na hora — sem passar pelo WhatsApp, sem ninguém digitar de novo.
   Se a nuvem estiver fora, o app segue funcionando local.
   ===================================================================== */
/* Projeto Supabase da Reobote — preencher com os dados do painel:
   Settings → API → Project URL e a chave publishable/anon.
   Precisa ser um projeto SÓ da Reobote: a chave fica visível no código,
   então quem abre esta página alcança tudo que o projeto expõe. */
const SB_URL='https://idrgoyxosahliwihamph.supabase.co';
const SB_KEY='sb_publishable_u55Bbrgy9OqxFHM4IEBSjg_wgl61NOP';
let sb=null, nuvem={ligado:false,erro:'',ultima:0};

function iniciaNuvem(){
  if(!SB_URL||!SB_KEY){ nuvem.erro='projeto Supabase da Reobote ainda não criado'; return; }
  try{
    if(!window.supabase) throw new Error('sem conexão para carregar a nuvem');
    sb=window.supabase.createClient(SB_URL,SB_KEY);
  }catch(e){ nuvem.erro='sem conexão'; return; }

  /* chegada instantânea */
  try{
    sb.channel('reobote-pedidos')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'reobote_pedidos'},
        p=>recebePedido(p.new,true))
      .subscribe(st=>{ nuvem.ligado=(st==='SUBSCRIBED'); if(VIEW==='config') RENDER.config(); });
  }catch(e){}

  /* rede de segurança: se o tempo real cair, ainda buscamos */
  puxaPedidos();
  setInterval(puxaPedidos,20000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) puxaPedidos(); });
}

async function puxaPedidos(){
  if(!sb) return;
  try{
    const desde=new Date(Date.now()-30*864e5).toISOString();
    const {data,error}=await sb.from('reobote_pedidos').select('*')
      .gte('criado_em',desde).order('criado_em',{ascending:false}).limit(200);
    if(error) throw error;
    nuvem.erro=''; nuvem.ultima=Date.now();
    let novos=0;
    (data||[]).forEach(r=>{ if(recebePedido(r,false)) novos++; });
    if(novos){ save(); avisaPedido(novos); RENDER[VIEW]&&RENDER[VIEW](); renderNav(); }
  }catch(e){
    nuvem.erro=(e&&e.message||'').includes('reobote_pedidos')
      ? 'tabela ainda não criada no Supabase' : 'sem conexão com a nuvem';
    if(VIEW==='config') RENDER.config();
  }
}

/* grava o pedido no app; devolve true se era inédito */
function recebePedido(r,avisar){
  if(!r||!r.id) return false;
  if(r.status==='cancelado') return false;
  if(DB.pedidos.some(p=>p.nuvemId===r.id)) return false;
  let c=DB.clientes.find(x=>x.nome.toLowerCase()===String(r.loja||'').toLowerCase());
  if(!c){ c={id:'c'+uid(),nome:r.loja||'Cliente',contato:r.tel||'',end:'',cidade:'',tipo:'mercado',ativo:1};
    DB.clientes.push(c); }
  else if(r.tel && !c.contato) c.contato=r.tel;
  DB.pedidos.push({id:uid(),nuvemId:r.id,cid:c.id,
    itens:(r.itens||[]).map(i=>({fid:i.fid,qtd:i.qtd,preco:i.preco})),
    status:r.status||'novo',data:r.criado_em||new Date().toISOString(),
    ts:new Date(r.criado_em||Date.now()).getTime(),total:+r.total||0,
    origem:'portal',entrega:r.entrega||'',obs:r.obs||'',quem:r.resp||r.loja||''});
  if(avisar){ save(); avisaPedido(1,r); RENDER[VIEW]&&RENDER[VIEW](); renderNav(); }
  return true;
}

/* ---------- o aviso ---------- */
function bip(){
  try{
    const A=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach((t,ix)=>{
      const o=A.createOscillator(), g=A.createGain();
      o.type='sine'; o.frequency.value=ix?1046:784;
      g.gain.setValueAtTime(0.0001,A.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.22,A.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+t+0.16);
      o.connect(g); g.connect(A.destination);
      o.start(A.currentTime+t); o.stop(A.currentTime+t+0.18);
    });
    setTimeout(()=>A.close(),800);
  }catch(e){}
}
function avisaPedido(n,r){
  bip(); vibra([60,50,60,50,120]);
  const titulo=n>1?n+' pedidos novos':'Pedido novo';
  const corpo=r?((r.loja||'Cliente')+' · '+money(+r.total||0)):'Chegaram pelo portal do cliente';
  try{
    if('Notification' in window && Notification.permission==='granted')
      new Notification(titulo,{body:corpo,icon:'assets/icon-192.png',badge:'assets/icon-192.png',
        tag:'reobote-pedido',renotify:true});
  }catch(e){}
  toast(titulo+' · '+corpo,'ok');
  const b=$('#btnAlerts'); if(b){ b.style.transform='scale(1.18)'; setTimeout(()=>b.style.transform='',260); }
}
async function pedeNotificacao(){
  if(!('Notification' in window)){ toast('Este aparelho não suporta notificação','bad'); return; }
  const r=await Notification.requestPermission();
  toast(r==='granted'?'Notificação ligada neste aparelho':'Você bloqueou as notificações', r==='granted'?'ok':'bad');
  if(VIEW==='config') RENDER.config();
}
document.addEventListener('click',e=>{ if(e.target.closest('#btnNotif')) pedeNotificacao(); });
setTimeout(iniciaNuvem,600);
</script>
